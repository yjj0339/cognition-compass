<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>认知罗盘 · 认知水平评估</title>
<meta name="description" content="基于认知心理学经典范式的认真评估：认知反思、逻辑推理、概率直觉、偏差识别、模式推理、工作记忆。约 15 分钟。">
<style>
:root{
  --bg:#F7F4ED; --card:#FFFFFF; --ink:#22303E; --ink2:#5C6B7A; --ink3:#8B97A3;
  --line:#E6E0D2; --accent:#2E5E8C; --accent-deep:#1F4465; --accent-soft:#EDF3F8;
  --gold:#B08D4A; --gold-soft:#F6EFDF; --good:#3D8B5F; --good-soft:#EAF4EE;
  --bad:#B85C50; --bad-soft:#F8EEEC; --warn:#A8842C;
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,"SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(34,48,62,.04),0 8px 28px rgba(34,48,62,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.78;min-height:100vh;
  background-image:radial-gradient(rgba(46,94,140,.045) 1px,transparent 1px);
  background-size:26px 26px;
}
#app{max-width:760px;margin:0 auto;padding:0 20px 90px}
/* ---------- 顶栏 & 进度 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(247,244,237,.92);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:14px 0 0;
}
.topbar .row{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.24em;color:var(--ink);cursor:pointer}
.brand b{color:var(--gold);font-weight:700}
.step-ind{font-size:12px;color:var(--ink3);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#C9A55E);
  border-radius:2px;transition:width .5s cubic-bezier(.22,.9,.35,1)}
/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:36px 38px;margin-top:34px;
  animation:rise .45s cubic-bezier(.22,.9,.35,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:560px){.card{padding:26px 22px;margin-top:22px}}
/* ---------- 封面 ---------- */
.hero{text-align:center;padding-top:20px}
.compass{width:190px;height:190px;margin:26px auto 6px;display:block}
.compass .slowspin{transform-origin:100px 100px;animation:spin 90s linear infinite}
.compass .needle{transform-origin:100px 100px;animation:sway 4.6s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.kicker{font-size:12px;letter-spacing:.5em;color:var(--gold);margin:14px 0 8px;text-indent:.5em}
h1.title{font-family:var(--serif);font-size:clamp(34px,7vw,50px);letter-spacing:.12em;font-weight:700}
.subtitle{color:var(--ink2);margin-top:10px;font-size:15.5px}
.basis{color:var(--ink3);font-size:12px;letter-spacing:.14em;margin-top:6px}
.hero-rule{width:56px;height:2px;background:var(--gold);margin:26px auto;border-radius:1px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 4px}
.facts .f{background:var(--accent-soft);border-radius:12px;padding:14px 8px}
.facts .n{font-family:var(--serif);font-size:24px;color:var(--accent-deep);font-weight:700;line-height:1.2}
.facts .t{font-size:12px;color:var(--ink2);margin-top:3px}
.dimlist{text-align:left;margin:26px 0 6px;border-top:1px solid var(--line)}
.dimlist li{list-style:none;display:flex;gap:14px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.dimlist .ico{width:26px;text-align:center;flex:none}
.dimlist b{font-family:var(--serif);letter-spacing:.06em;flex:none;font-weight:700}
.dimlist span{color:var(--ink2);font-size:13.5px}
.notice{background:var(--gold-soft);border:1px solid #E7DBBB;border-radius:12px;padding:14px 18px;font-size:13.5px;color:#7A6231;margin:22px 0 6px;line-height:1.8}
.notice b{color:#6B5420}
/* ---------- 按钮 ---------- */
.btn{
  display:block;width:100%;border:none;cursor:pointer;font-family:var(--sans);
  background:var(--accent);color:#fff;font-size:16.5px;letter-spacing:.28em;text-indent:.28em;
  padding:16px;border-radius:12px;margin-top:26px;transition:.2s;font-weight:600;
}
.btn:hover:not(:disabled){background:var(--accent-deep);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line);letter-spacing:.14em;font-size:14px}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
/* ---------- 自评滑块 ---------- */
.slider-wrap{margin:30px 0 8px}
.bigpct{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--accent-deep);text-align:center;line-height:1.15;font-variant-numeric:tabular-nums}
.bigpct small{font-size:26px;color:var(--ink3)}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) var(--fill,60%),var(--line) var(--fill,60%));outline:none;margin:18px 0 6px}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(31,68,101,.25);cursor:pointer}
.scale-marks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-bottom:8px}
/* ---------- 节间过渡 ---------- */
.sec-badge{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px}
.sec-kicker{font-size:11.5px;letter-spacing:.4em;color:var(--gold);text-indent:.4em}
.sec-name{font-family:var(--serif);font-size:32px;letter-spacing:.1em;margin:8px 0 14px;font-weight:700}
.sec-intro{color:var(--ink2);font-size:15px;text-align:justify}
.sec-meta{margin-top:20px;font-size:13px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:14px}
/* ---------- 题目 ---------- */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.qno{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:600}
.qtag{font-size:11.5px;color:var(--ink3);background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.qtext{font-size:17.5px;font-weight:600;line-height:1.9;margin-bottom:24px;font-family:var(--sans)}
.qtext .em{color:var(--accent-deep);border-bottom:2px solid var(--gold)}
.numline{font-family:var(--mono);font-size:24px;letter-spacing:.12em;color:var(--accent-deep);background:var(--accent-soft);
  display:inline-block;padding:8px 18px;border-radius:10px;margin-top:10px;font-weight:600}
.numtab{display:inline-grid;grid-template-columns:auto auto auto auto;gap:6px 18px;margin-top:12px;font-family:var(--mono);font-size:19px;color:var(--accent-deep)}
.numtab i{font-style:normal;color:var(--ink3);font-size:12px;align-self:center;font-family:var(--sans)}
.numtab .row1{grid-row:1}.numtab .row2{grid-row:2}.numtab .row3{grid-row:3}
.numtab span{background:var(--accent-soft);padding:4px 12px;border-radius:8px;text-align:center;min-width:52px}
.numtab .qm{background:var(--gold-soft);color:var(--gold);font-weight:700}
.opts{display:grid;gap:11px}
.opt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:#FDFCF9;border:1.5px solid var(--line);border-radius:12px;padding:14px 17px;
  font-size:15.5px;cursor:pointer;transition:.16s;color:var(--ink);font-family:var(--sans);line-height:1.65;
}
.opt:hover{border-color:#C8BFA8;background:#FBF9F2}
.opt .abc{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #CFC6AE;display:flex;
  align-items:center;justify-content:center;font-size:12.5px;color:var(--ink2);margin-top:1px;font-weight:600}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(46,94,140,.1)}
.opt.sel .abc{background:var(--accent);border-color:var(--accent);color:#fff}
/* 图形题 */
.figgrid{display:grid;grid-template-columns:repeat(3,78px);grid-template-rows:repeat(3,78px);gap:8px;
  justify-content:center;margin:8px 0 22px;background:var(--bg);padding:16px;border-radius:14px;border:1px solid var(--line)}
.figgrid .cell{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}
.figgrid .cell.qm{border-style:dashed;border-color:var(--gold);color:var(--gold);font-family:var(--serif);font-size:26px;font-weight:700}
.figopts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.figopts .opt{justify-content:center;align-items:center;display:flex;gap:0;padding:10px}
/* ---------- 置信度 ---------- */
.conf-zone{margin-top:26px;padding-top:22px;border-top:1px dashed var(--line);animation:rise .3s both}
.conf-label{font-size:13px;color:var(--ink2);margin-bottom:12px}
.conf-label b{color:var(--ink)}
.confs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:560px){.confs{grid-template-columns:1fr}}
.conf{border:1.5px solid var(--line);background:#FDFCF9;border-radius:11px;padding:11px 8px;cursor:pointer;text-align:center;transition:.15s;font-family:var(--sans)}
.conf .c1{font-size:14px;font-weight:600;color:var(--ink)}
.conf .c2{font-size:11.5px;color:var(--ink3);margin-top:2px}
.conf:hover{border-color:#C8BFA8}
.conf.sel{border-color:var(--gold);background:var(--gold-soft)}
.conf.sel .c1{color:#7A5B1E}.conf.sel .c2{color:var(--gold)}
/* ---------- 工作记忆 ---------- */
.wm-stage{text-align:center;padding:20px 0 6px}
.wm-digits{font-family:var(--mono);font-size:clamp(42px,10vw,60px);font-weight:700;letter-spacing:.35em;text-indent:.35em;
  color:var(--accent-deep);margin:30px 0 26px;min-height:1.3em;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.wm-timer{height:4px;background:var(--line);border-radius:2px;max-width:280px;margin:0 auto;overflow:hidden}
.wm-timer i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:left}
.wm-input{font-family:var(--mono);font-size:30px;text-align:center;letter-spacing:.3em;width:100%;
  border:2px solid var(--line);border-radius:12px;padding:14px;outline:none;margin-top:26px;color:var(--accent-deep)}
.wm-input:focus{border-color:var(--accent)}
.wm-fb{margin-top:18px;font-size:15px;min-height:28px}
.wm-fb.ok{color:var(--good)}.wm-fb.no{color:var(--bad)}
.wm-lv{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.wm-lv i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.wm-lv i.done{background:var(--good)}.wm-lv i.now{background:var(--gold)}
/* ---------- 结果页 ---------- */
.res-hero{text-align:center;padding-top:14px}
.res-kicker{font-size:11.5px;letter-spacing:.42em;color:var(--gold);text-indent:.42em}
.score-big{font-family:var(--serif);font-size:clamp(72px,18vw,110px);font-weight:700;color:var(--accent-deep);line-height:1.05;font-variant-numeric:tabular-nums}
.score-cap{color:var(--ink3);font-size:13px;letter-spacing:.2em;margin-top:-2px}
.level-pill{display:inline-block;margin-top:16px;padding:9px 26px;border-radius:99px;background:var(--accent);color:#fff;
  font-family:var(--serif);font-size:19px;letter-spacing:.2em;text-indent:.2em;box-shadow:0 6px 18px rgba(31,68,101,.28)}
.pct-line{margin-top:18px;color:var(--ink2);font-size:14.5px}
.pct-line b{color:var(--ink);font-size:17px}
.res-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
@media(max-width:560px){.res-grid2{grid-template-columns:1fr}}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:16px 18px;text-align:center}
.mini .v{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--ink);line-height:1.3;font-variant-numeric:tabular-nums}
.mini .k{font-size:12px;color:var(--ink3);margin-top:4px;letter-spacing:.06em}
.mini .sub{font-size:11.5px;margin-top:3px;color:var(--ink2)}
.portrait{margin-top:26px;padding:20px 24px;background:linear-gradient(135deg,#FBF8F1,#F4F0E4);border:1px solid #E8DFC8;border-radius:13px;font-size:15px;text-align:justify;color:#4B4433}
.portrait b{color:var(--accent-deep)}
.radar-wrap{display:flex;justify-content:center;padding:6px 0 2px}
.sec-title{font-family:var(--serif);font-size:21px;letter-spacing:.14em;font-weight:700;display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.dimrows{display:grid;gap:15px}
.dimrow .head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.dimrow .head b{font-family:var(--serif);letter-spacing:.05em}
.dimrow .head span{color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4A77A3,var(--accent));width:0;transition:width 1.1s cubic-bezier(.22,.9,.3,1)}
.dimrow .note{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.65}
.cal-card{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;align-items:center}
.cal-num{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--accent-deep);grid-row:span 2;font-variant-numeric:tabular-nums}
.dkt{display:flex;align-items:center;gap:0;margin:24px 0 10px}
.dkt .pole{width:74px;text-align:center;font-size:12px;color:var(--ink3)}
.dkt .track{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent-soft),var(--line));position:relative}
.dkt .pin{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;transition:left 1.2s cubic-bezier(.22,.9,.3,1)}
.dkt .pin.self{background:var(--ink3);z-index:2}
.dkt .pin.real{background:var(--accent);box-shadow:0 2px 8px rgba(31,68,101,.35);z-index:3}
.legend{display:flex;gap:22px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.msg{border-radius:12px;padding:14px 18px;font-size:13.8px;line-height:1.8;margin-top:14px}
.msg.good{background:var(--good-soft);color:#2F6B4A;border:1px solid #CFE3D6}
.msg.warn{background:var(--bad-soft);color:#8C463C;border:1px solid #EBD3CE}
.msg.info{background:var(--accent-soft);color:#2A5077;border:1px solid #D3E1EC}
/* 逐题回顾 */
details.qa{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#FDFCF9;overflow:hidden}
details.qa summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;padding:13px 17px;font-size:14.5px;user-select:none}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary .mk{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
details.qa.ok summary .mk{background:var(--good)}
details.qa.no summary .mk{background:var(--bad)}
details.qa summary .t{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.qa summary .arr{color:var(--ink3);transition:.25s;flex:none}
details.qa[open] summary .arr{transform:rotate(90deg)}
details.qa .body{padding:2px 18px 18px 54px;border-top:1px dashed var(--line);font-size:13.8px;color:var(--ink2);line-height:1.85;text-align:justify}
details.qa .body .yours{margin:10px 0;padding:10px 14px;border-radius:9px;font-size:13px}
details.qa .body .yours.ok{background:var(--good-soft);color:#2F6B4A}
details.qa .body .yours.no{background:var(--bad-soft);color:#8C463C}
details.qa .body .exp b{color:var(--ink)}
/* 分水岭 */
.waters{display:grid;gap:14px}
.water{display:grid;grid-template-columns:112px 1fr;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line)}
.water:last-child{border-bottom:none}
@media(max-width:560px){.water{grid-template-columns:1fr;gap:8px}}
.water .wname{font-family:var(--serif);font-weight:700;font-size:15.5px;letter-spacing:.05em;color:var(--accent-deep)}
.water .vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.water .vs div{font-size:12.8px;line-height:1.7;padding:10px 13px;border-radius:9px}
.water .vs .lo{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.water .vs .hi{background:var(--accent-soft);color:#2A5077;border:1px solid #D3E1EC}
.water .vs b{display:block;font-size:11px;letter-spacing:.15em;margin-bottom:3px;opacity:.7}
.disclaimer{font-size:12.3px;color:var(--ink3);line-height:1.85;text-align:justify;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.linkline{text-align:center;margin-top:18px;font-size:13px;color:var(--ink3)}
.linkline a{color:var(--accent);text-decoration:none;cursor:pointer}
.selftest{font-family:var(--mono);font-size:11px;color:#999;white-space:pre-wrap;padding:12px;margin-top:30px;background:#FAFAF6;border-radius:8px}
footer{margin-top:52px;text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.1em;line-height:2}
.fade-out{animation:fadeout .18s both}
@keyframes fadeout{to{opacity:0}}
</style>
</head>
<body>
<div id="app"><div class="topbar"><div class="row"><span class="brand" onclick="restartConfirm()">认知<b>罗盘</b></span><span class="step-ind" id="stepInd"></span></div><div class="progress"><i id="progBar" style="width:0%"></i></div></div><div id="stage"></div></div>

<script>
"use strict";
/* =====================================================================
   认知罗盘 · 认知水平评估
   范式来源：CRT (Frederick 2005) / Wason 选择任务 (1966) /
   Kahneman & Tversky 概率判断 / Raven 式矩阵 / 数字倒叙广度
   ===================================================================== */
const VERSION = 1;
const CONF_VALS = [0.55, 0.75, 0.95];
const CONF_NAMES = [["纯靠直觉","55%"],["比较有把握","75%"],["非常确定","95%"]];

const SECTIONS = [
 {key:"reflect",name:"认知反思",icon:"⏳",what:"测什么",
  intro:"这一部分的每道题，都有一个「听起来立刻就对」的答案——它通常是错的。心理学家弗雷德里克（Frederick, 2005）用这类题目测量<b>认知反思</b>：能否觉察到直觉在抢答，并把它按住、动笔验证。这个特质预测的不只是聪明，而是「愿不愿意动用聪明」。",
  meta:"共 6 题 · 请刻意放慢速度"},
 {key:"logic",name:"逻辑推理",icon:"🧩",what:"测什么",
  intro:"只依据题目<b>给定</b>的规则作严格推导，不被常识和画面感带偏。三段论、条件推理与沃森（Wason, 1966）选择任务是「讲道理」的底层硬件检测——抽象版沃森任务的通过率通常不足 10%，它专测你是否真的在按规则、而不是按感觉推理。",
  meta:"共 4 题 · 抛开常识，只认规则"},
 {key:"prob",name:"概率直觉",icon:"🎲",what:"测什么",

/* ---------------------- 题库 ---------------------- */
const QUESTIONS = [
 /* 第一节 认知反思 */
 {sec:0,w:1.2,a:2,trap:0,
  text:`一副球拍和一个球一共 <span class="em">11 元</span>。球拍比球贵 <span class="em">10 元</span>。请问球多少钱？`,
  opts:["1 元","1.5 元","0.5 元","2 元"],
  explain:`设球为 x 元，球拍为 x+10 元，则 x+(x+10)=11，解得 x=0.5。直觉会立刻报出「1 元」，但 0.5+10.5=11 才成立；若球 1 元，总价会是 12 元。这道题来自弗雷德里克 2005 年的经典「认知反思测验」（CRT），在哈佛、MIT 学生中也有近半数人答错——它测的不是算术能力，而是你有没有<b>压住第一反应去验证</b>。`},
 {sec:0,w:1.1,a:0,trap:1,
  text:`把一根木头锯成 <span class="em">3 段</span>需要 <span class="em">6 分钟</span>。按同样速度，锯成 6 段需要多少分钟？`,
  opts:["15 分钟","12 分钟","18 分钟","10 分钟"],
  explain:`锯成 3 段只需要锯 <b>2 刀</b>，每刀 3 分钟；锯成 6 段需要 <b>5 刀</b>，共 15 分钟。「6 是 3 的两倍，所以 12 分钟」是直觉陷阱——段数与刀数永远相差 1。这类「差一」结构（锯木、敲钟、上楼）是检验你是否对题目做结构分析、而非表面数字匹配的探针。`},
 {sec:0,w:1.2,a:3,trap:1,
  text:`湖面的睡莲每天扩张的面积是前一天的<span class="em">两倍</span>。若第 <span class="em">48 天</span>盖满整个湖面，第几天盖满一半？`,
  opts:["第 12 天","第 24 天","第 36 天","第 47 天"],
  explain:`每天翻倍意味着「往回一天就减半」：第 48 天满湖，第 47 天恰好半个湖。直觉用比例思维得出 24（48 的一半），但指数增长的正确打开方式是逆向的。指数思维是人类最不直觉的数学结构之一——它也是理解复利、传染病传播、人口增长的关键。`},
 {sec:0,w:1.1,a:0,trap:1,
  text:`<span class="em">5 台机器 5 分钟</span>生产 <span class="em">5 个零件</span>。照此效率，100 台机器生产 100 个零件需要多少分钟？`,
  opts:["5 分钟","100 分钟","20 分钟","50 分钟"],
  explain:`每台机器 5 分钟生产 1 个零件，100 台同时开工，5 分钟就产出 100 个。直觉会把「100」这个数字到处搬运，得出 100 分钟。关键在归一化：先算出<b>单台、单位时间</b>的产出，再放大。拒绝归一化、直接在表面数字之间连线，是直觉思维的典型动作。`},
 {sec:0,w:1.0,a:1,trap:0,
  text:`长跑比赛中，你刚刚<b>超过了第二名</b>。你现在排第几？`,
  opts:["第一名","第二名","第三名","无法确定"],
  explain:`超过第二名后，你顶替的是他的位置：<b>第二名</b>——你前面还有第一名。直觉的画面感太强（「超过 → 我在最前面」），抢在逻辑之前给出了答案。认知反思的本质就在这里：画面越生动、答案越「显然」，越值得停半秒检查。`},
 {sec:0,w:1.0,a:0,trap:1,
  text:`农夫养了 17 只羊，<span class="em">除了 9 只以外</span>都病死了。还活着几只？`,
  opts:["9 只","8 只","17 只","0 只"],
  explain:`「除了 9 只以外都死了」——活着的正是那 9 只。直觉抓错句法结构时会算 17−9=8。语言中的否定与例外结构（「除了…都…」）是天然的思维陷阱：大脑倾向按词语顺序直译成算式，而不是先解析句法。`},
 /* 第二节 逻辑推理 */
 {sec:1,w:1.5,a:3,trap:0,
  text:`桌上有四张卡片，每张一面是<b>字母</b>、另一面是<b>数字</b>。有人声称：「每张一面是<b>元音字母</b>的卡片，另一面必然是<b>偶数</b>。」<br>现在露出 A、B、4、7 四个面。最少翻开哪几张，就能检验这句话的真假？`,
  opts:["A 和 4","4 和 7","A、B、4、7 全翻","A 和 7"],
  explain:`规则只约束「元音 → 偶数」：A 背后若是奇数，规则即被推翻，<b>必须翻</b>；7 背后若是元音，同样推翻规则，<b>必须翻</b>；B 是辅音，背面奇偶都无关；4 背后即便是元音也不违反规则。这是著名的<b>沃森选择任务</b>（Wason, 1966），抽象版通过率不足 10%。有趣的是：换成「检查喝酒的人是否满 18 岁」（翻「啤酒」和「16 岁」），多数人立刻会做——逻辑能力相同，熟悉语境却更容易被大脑调用。这提示我们：警惕自己在陌生语境下的推理质量。`,
  fig:null},
 {sec:1,w:1.2,a:0,trap:1,
  text:`前提一：所有玫瑰都是花。<br>前提二：有些花很快就枯萎。<br>结论：<span class="em">有些玫瑰很快就枯萎</span>。<br>仅凭这两个前提，这个结论——`,
  opts:["不必然成立（前提全真时，结论仍可能是假的）","必然成立","必然为假","无法判断前提真假"],
  explain:`「很快枯萎的花」可能全部是别的花（比如昙花），一朵玫瑰都不在其中，两个前提依然为真——所以结论<b>不必然成立</b>。人们容易把它读成必然，是因为玫瑰的画面在脑中不断成像（「气氛效应」）。严格推理只承认逻辑形式，不承认画面：结论的范围一旦超出前提的范围，推论就失效。`},
 {sec:1,w:1.1,a:3,trap:0,
  text:`已知：「如果小王去健身房，那么他当天会发朋友圈。」今天小王<b>发了朋友圈</b>。由此能严格推出——`,
  opts:["小王去了健身房","小王没去健身房","小王今天心情不错","以上都无法必然推出"],
  explain:`「去健身房 → 发朋友圈」并不排除别的原因也发朋友圈（吃了好吃的、晒猫）。看到结果就反推那个原因，叫<b>肯定后件谬误</b>——它是生活中大多数「我早就知道会这样」的来源。C 选项更是无中生有。能在熟悉的日常情境里守住这条边界，是逻辑素养最实用的体现。`},
 {sec:1,w:1.2,a:2,trap:0,
  text:`法律规定：「<b>只有</b>年满 18 周岁，才能报名考驾照。」小张刚满 18 周岁。由此能严格推出——`,
  opts:["小张可以报名考驾照","小张不可以报名考驾照","两者都推不出来"],
  explain:`「只有…才…」表达的是<b>必要条件</b>而非充分条件：年满 18 是门槛，但可能还有其他条件（视力、无禁驾记录等）。满足必要条件 ≠ 自动满足全部条件。「只要满 18 就能考」才是充分条件表述——一字之差，逻辑结构完全不同。合同、法条、规章里到处是这类措辞。`},
 /* 第三节 概率直觉 */
 {sec:2,w:1.5,a:3,trap:0,
  text:`某种疾病在人群中的发病率是 <span class="em">0.1%</span>。检测手段很灵敏：真患者被检出阳性的概率是 <span class="em">95%</span>；但健康人也有 <span class="em">5%</span> 的概率被误报为阳性。<br>现在一个随机抽到的人检测出<b>阳性</b>，他真正患病的概率最接近——`,
  opts:["95%","约 50%","约 30%","约 2%"],
  explain:`想象 10000 人：患者约 10 人，其中约 9.5 人呈阳性；健康人约 9990 人，其中 5%（约 500 人）被误报。阳性者共约 509 人，真患者只占 9.5/509 ≈ <b>2%</b>。这就是<b>基础率忽视</b>：当事件本身极罕见时，哪怕检测很准，阳性结果的大头仍是误报。研究中医生群体对这类题的平均估计也显著偏高——把它换成「每 10000 人中」的自然频数来想，是普通人最可行的纠偏技巧。`},
 {sec:2,w:1.0,a:1,trap:0,
  text:`一枚均匀的硬币连续抛出了 <span class="em">5 次正面</span>。第 6 次抛出反面的概率是——`,
  opts:["大于 50%（该出反面了）","恰好 50%","小于 50%（正手气还在）"],
  explain:`硬币没有记忆，独立事件的概率不变。<b>赌徒谬误</b>（「该出反面了」）与热手谬误（「手气还在」）方向相反、结构相同：都把随机序列当成了有节奏的剧情。人对「连续 5 次正面」感到异常，是因为真随机看起来反而「不够随机」——它恰恰是随机性最正常的产出之一。`},
 {sec:2,w:1.3,a:2,trap:0,
  text:`游戏节目里有三扇门，一扇背后是汽车，其余是空的。你选了 1 号门。<b>知道答案</b>的主持人打开 3 号门，展示它是空的，然后问：「要换成 2 号门吗？」换门赢汽车的概率是——`,
  opts:["1/2","1/3","2/3","换不换都一样"],
  explain:`你首次选中的概率是 1/3，选空门的概率是 2/3。主持人的开门是「知情展示」，不改变这个比例，只是把 2/3 的胜率<b>集中</b>到了另一扇未开的门上。枚举验证：车在 1 号门时换门输，车在 2、3 号门时换门都赢——2/3。直觉答 1/2 是因为忽略了「主持人知道答案、刻意避开车」这个信息不对称；他开门不是随机事件，而是带信息的动作。`},
 {sec:2,w:1.3,a:0,trap:1,
  text:`Linda 今年 31 岁，单身、直言不讳、哲学系毕业。学生时代她关心社会歧视与公平，参加过反歧视游行。<br>以下哪种情况<b>更有可能</b>为真？`,
  opts:["Linda 是银行柜员","Linda 是银行柜员，并且是活跃的女权主义者","两者一样可能"],
  explain:`两个事件同时发生的概率不可能大于单个事件：P(A 且 B) ≤ P(A)。「柜员 <b>且</b> 女权主义者」是「柜员」的子集，必然更少。但描述越具体、画面越连贯，大脑越觉得它可信——这叫<b>合取谬误</b>。卡尼曼与特沃斯基的实验中，约 85% 的斯坦福学生选了后者。故事讲得通 ≠ 更可能发生，这是「叙事迷惑性」最经典的证明，也是阴谋论、精致骗局共同利用的心理漏洞。`},
 {sec:2,w:1.1,a:1,trap:2,
  text:`某城有大、小两家医院。大医院每天约出生 <span class="em">45 个</span>婴儿，小医院约 <span class="em">15 个</span>。记录一整年后，哪家医院「当天男婴比例超过 60%」的<b>天数更多</b>？`,
  opts:["大医院","小医院","基本一样多"],
  explain:`样本越小，比例的随机波动越大。小医院 15 个婴儿里 9 个男孩就超过 60%，这种波动天天可能出现；大医院要 27/45 以上才超标，难得一见。把小样本的波动当成真实规律，称为<b>小数定律</b>谬误——它是「我朋友吃了个偏方就好了」「这软件连着三次出错」等日常错觉的共同来源。问一句「样本多大？」能挡掉大半的错误结论。`},
 /* 第四节 偏差识别 */
 {sec:3,w:1.2,a:1,trap:0,
  text:`二战中，军方统计<b>返航</b>轰炸机的弹孔分布：机翼、机身弹孔密集，发动机部位弹孔稀少。装甲有限，应该优先加固哪里？`,
  opts:["弹孔最密集的机翼","几乎没有弹孔的发动机部位","全机均匀加固"],
  explain:`返航飞机展示的是「中弹还能飞回来」的位置；发动机中弹的飞机大多坠毁了，根本没回来接受统计。数据里<b>最少的弹孔，恰恰标记着最致命的位置</b>。统计学家亚伯拉罕·沃德的这个判断是<b>幸存者偏差</b>最著名的应用。凡是「看得见的数据」都先问一句：没被看见的那部分，是怎么被筛掉的？——成功学、用户反馈、体检样本，无一例外。`},
 {sec:3,w:1.0,a:1,trap:0,
  text:`你花 80 元买了张电影票（不可退）。看了 30 分钟后确认：这是部烂片。接下来怎样选择最理性？`,
  opts:["坚持看完，票钱不能白花","立刻离场，把时间用在别处","看到一半再走，对得起票钱"],
  explain:`无论走不走，80 元都回不来了——它是<b>沉没成本</b>，理性决策只比较「接下来的时间怎么用更值」。「票都买了」「来都来了」「都谈三年了」是同一个谬误的日常形态：用更多的投入去补偿已经损失的投入。能切割沉没成本的人，不是无情，而是把账算在了<b>未来</b>而不是过去。`},
 {sec:3,w:1.1,a:2,trap:0,
  text:`统计发现：冰淇淋销量越高的月份，溺水人数也越多。最合理的解释是——`,
  opts:["吃冰淇淋的人更容易溺水","溺水事件让人们用冰淇淋减压","夏季气温同时推高了两者"],
  explain:`两个变量一起变动，不代表谁导致谁——很可能是第三个因素（气温）在共同驱动，也可能纯属巧合。<b>相关不等于因果</b>人人会说，但落在具体数字上时，大脑的故事本能总是抢先给出因果剧本。看到任何「A 与 B 显著相关」的新闻，第一反应应该是找第三变量和反向因果，其次才是接受结论。`},
 {sec:3,w:0.0,a:2,att:true,
  text:`这是一道<b>注意力检查题</b>，与其他题目无关。请直接选择「丙」。`,
  opts:["甲","乙","丙","丁"],
  explain:`注意力检查题：只要认真读题就能答对。它用于识别「随手作答」模式。`},
 {sec:3,w:1.0,a:0,trap:2,
  text:`同一台手术的同一个统计事实，有两种说法：<br>说法 A：「术后一个月<b>存活率 90%</b>。」<br>说法 B：「术后一个月<b>死亡率 10%</b>。」<br>心理学实验发现，患者听到哪种说法更倾向于同意手术？`,
  opts:["说法 A（存活率）","说法 B（死亡率）","两种说法效果完全相同"],
  explain:`90% 存活与 10% 死亡是<b>同一个事实</b>，但人们的选择会随表述方向显著改变——这叫<b>框架效应</b>（卡尼曼与特沃斯基发现）。它证明：人对「事实」的反应，很大程度取决于事实被包装的方式。因此认知高的人有个习惯：听到任何单一表述，会主动把它翻译成相反框架（「成功率 90%」↔「失败率 10%」）再核对一次自己的感受是否被措辞操纵。`},
 /* 第五节 模式推理 */
 {sec:4,w:1.0,a:2,trap:0,
  text:`找出规律，推断下一个数：<div class="numline">3 &nbsp;8 &nbsp;18 &nbsp;38 &nbsp;78 &nbsp;?</div>`,
  opts:["148","156","158","166"],
  explain:`后一项 = 前一项 ×2 + 2：3→8→18→38→78→<b>158</b>。另一视角：差值依次为 5、10、20、40、80，每次翻倍。数列推理的通用策略：先看差值、再看差值的差值（二阶规律），然后试倍数与交叉规律。`},
 {sec:4,w:1.1,a:1,trap:0,
  text:`找出规律，推断下一个数：<div class="numline">2 &nbsp;3 &nbsp;5 &nbsp;9 &nbsp;17 &nbsp;?</div>`,
  opts:["25","33","31","35"],
  explain:`差值依次是 1、2、4、8、16（每次翻倍），17+16=<b>33</b>。另一视角：每项 = 前两项之和 + 1。发现「规律可以有多条路径」本身就是模式推理的高阶能力——能验证答案同时满足多种结构，置信度才高。`},
 {sec:4,w:1.2,a:2,trap:0,
  text:`观察每行三个数之间的规律：<div class="numtab"><i class="row1">第一行</i><span class="row1">2</span><span class="row1">5</span><span class="row1">10</span><i class="row2">第二行</i><span class="row2">3</span><span class="row2">7</span><span class="row2">14</span><i class="row3">第三行</i><span class="row3">4</span><span class="row3">9</span><span class="row3 qm">?</span></div>`,
  opts:["16","17","18","20"],

/* ---------------------- 计分 ---------------------- */
const DIM_WEIGHTS={reflect:.20,logic:.18,prob:.20,bias:.15,pattern:.12,wm:.15};
function computeScores(st){
  const got={},max={};
  SECTIONS.forEach(s=>{got[s.key]=0;max[s.key]=0;});
  let correct=0,scorable=0;
  QUESTIONS.forEach((q,i)=>{
    const a=st.answers[i];
    if(q.att)return;
    scorable++;
    max[SECTIONS[q.sec].key]+=q.w;
    if(a&&a.choice===q.a){got[SECTIONS[q.sec].key]+=q.w;correct++;}
  });
  let wmGot=0,wmMax=0;
  st.wm.forEach(t=>{wmMax+=1.2;if(t.ok)wmGot+=1.2;});
  const dims={};
  SECTIONS.forEach(s=>dims[s.key]=max[s.key]>0?Math.round(got[s.key]/max[s.key]*100):0);
  dims.wm=wmMax>0?Math.round(wmGot/wmMax*100):0;
  let idx=0;for(const k in DIM_WEIGHTS)idx+=DIM_WEIGHTS[k]*dims[k];
  idx=Math.round(idx);
  const pct=Math.min(99.4,Math.round(100/(1+Math.exp(-(idx-48)/11))*10)/10);
  /* 元认知：Brier 与过度自信 */
  let bs=0,bn=0,hiTot=0,hiWrong=0;
  QUESTIONS.forEach((q,i)=>{
    const a=st.answers[i];if(!a||q.att)return;
    const c=CONF_VALS[a.conf],cor=a.choice===q.a?1:0;
    bs+=(c-cor)**2;bn++;
    if(a.conf===2){hiTot++;if(!cor)hiWrong++;}
  });
  const brier=bn?bs/bn:null;
  const calib=brier==null?null:Math.max(0,Math.round((0.25-brier)/0.25*100));
  const overconf=hiTot?hiWrong/hiTot:0;
  /* 反应时 */
  const times=QUESTIONS.map((q,i)=>q.att?null:st.answers[i]).filter(a=>a).map(a=>a.timeMs).sort((a,b)=>a-b);
  const medTime=times.length?times[Math.floor(times.length/2)]:null;
  const fastCount=times.filter(t=>t<3500).length;
  const attIdx=QUESTIONS.findIndex(q=>q.att);
  const attOk=attIdx>=0&&st.answers[attIdx]?st.answers[attIdx].choice===QUESTIONS[attIdx].a:null;
  return{dims,idx,pct,correct,scorable,brier,calib,overconf,hiTot,hiWrong,medTime,fastCount,attOk,
         selfPct:st.selfRating};
}
function levelOf(idx){
  if(idx>=78)return["L5 · 元认知者","你不仅思考，还持续监控自己的思考过程；直觉是你的员工，不是你的老板。"];
  if(idx>=62)return["L4 · 系统思考者","概率与逻辑已内化为习惯性动作，能在问题现场主动调用它们。"];
  if(idx>=48)return["L3 · 反思思考者","你具备压制直觉、放慢验证的能力，多数陷阱拦不住你，但系统性偶有失守。"];
  if(idx>=33)return["L2 · 常识思考者","常识推理可靠，但在「听起来立刻就对」的陷阱面前防线较薄。"];
  return["L1 · 直觉行者","决策主要依赖第一反应。好消息：反思能力完全可训练，本题库解析就是起点。"];
}

function radarSVG(dims){

  let grid="";
  for(const f of[.2,.4,.6,.8,1]){
    const ps=vals.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(",")).join(" ");
    grid+=`<polygon points="${ps}" fill="none" stroke="#E3DDCD" stroke-width="1"/>`;
  }
  let axes="",lab="";
  labels.forEach((l,i)=>{
    const[x,y]=pt(i,R);axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E3DDCD"/>`;
    const[lx,ly]=pt(i,R+30);
    lab+=`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="middle" font-size="15" fill="#22303E" font-weight="600" font-family="Songti SC,STSong,Georgia,serif">${l}</text>`;
    const vx=vals[i];
    lab+=`<text x="${((lx-cx)*.82+cx).toFixed(1)}" y="${((ly-cy)*.82+cy-10).toFixed(1)}" text-anchor="middle" font-size="11.5" fill="#B08D4A" font-weight="700">${vx}</text>`;
  });
  const poly=vals.map((v,i)=>pt(i,R*Math.max(v,2)/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 350 330" style="width:min(100%,360px);display:block">
    ${grid}${axes}
    <polygon points="${poly}" fill="rgba(46,94,140,.16)" stroke="#2E5E8C" stroke-width="2.2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>{const[x,y]=pt(i,R*Math.max(v,2)/100);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="#2E5E8C"/>`;}).join("")}
    ${lab}
  </svg>`;
}
const DIM_NOTES={

  pattern:"序列与图形中的抽象规则发现（流体智力）",

  logic:"练习把论证拆成「前提 → 结论」两栏，逐行检查每一步是否『必然』成立，接受常识缺席。",
  prob:"遇到概率判断先换算成自然频数：「每 10000 人中有多少人」；再问一句样本多大、基础率多少。",
  bias:"决策前固定问两个问题：「我没看到的数据里藏着什么？」「这个说法换个框架我还同意吗？」",
  pattern:"规律常藏在差值、差值的差值、旋转与交叉结构里；数独、瑞文练习题对该能力有直接训练效果。",
  wm:"减少多任务切换，把复杂信息外化到纸面；工作记忆像肌肉，睡眠与专注训练都能改善它。"

  }

  let confMsg="";
  if(R.overconf>=.4&&R.hiTot>=3)confMsg=`<div class="msg warn">你在 ${R.hiTot} 道「非常确定」的题里错了 ${R.hiWrong} 道——<b>高置信错误率 ${Math.round(R.overconf*100)}%</b>。直觉的可靠性没有你以为的那么高：校准的方向是「把一部分『非常确定』降级为『比较确定』，并对高 stakes 决策加装验证步骤」。</div>`;
  else if(R.calib>=60)confMsg=`<div class="msg good">置信度与正确率的匹配良好（校准指数 ${R.calib}）：你不仅「答得对」，还「知道自己什么时候对」——这是专家级决策者的标志性特征。</div>`;
  else confMsg=`<div class="msg info">校准指数 ${R.calib}：把握程度与实际正确率之间还有调整空间。好的校准目标是——95% 置信时每 20 题最多错 1 题。</div>`;
  /* 速度 & 注意力 */
  let speedMsg="";
  if(R.medTime!=null){
    const sec=(R.medTime/1000).toFixed(1);
    speedMsg=R.fastCount>=R.scorable*.4
      ?`<div class="msg warn">中位作答时间 ${sec} 秒，且 ${R.fastCount}/${R.scorable} 题不足 3.5 秒——<b>作答偏快</b>。对直觉陷阱类题目，速度是最强的敌人；放慢本身就能显著提高正确率。</div>`
      :`<div class="msg info">中位作答时间 ${sec} 秒（加工速度参考）。</div>`;
  }
  let attMsg=R.attOk===false?`<div class="msg warn">注意力检查题<b>未通过</b>——本次可能存在随手作答，结果或低估了你的真实水平。建议在安静状态下重测一次。</div>`:`<div class="msg good">注意力检查通过，作答认真度良好。</div>`;

  /* 逐题回顾 */
  const reviewHTML=QUESTIONS.map((q,i)=>{
    const a=S.answers[i];
    const ok=a&&a.choice===q.a;
    const brief=(q.fig?"图形旋转矩阵（九宫格）":q.text.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,34))+"…";
    const yoursTxt=a?(q.fig?q.figAngles[a.choice]+"° 图形":q.opts[a.choice]):"未作答";
    const rightTxt=q.fig?q.figAngles[q.a]+"° 图形":q.opts[q.a];
    return `<details class="qa ${ok?"ok":"no"}">
      <summary><span class="mk">${ok?"✓":"✗"}</span><span class="t">${i+1}. ${brief}</span><span class="arr">›</span></summary>
      <div class="body">
        <div>${q.text}</div>
        <div class="yours ${ok?"ok":"no"}">你的答案：${yoursTxt}　·　把握：${a?CONF_NAMES[a.conf][0]:"—"}　·　用时：${a?(a.timeMs/1000).toFixed(1)+"s":"—"}</div>
        ${ok?"":`<div class="yours no">正确答案：${rightTxt}</div>`}
        <div class="exp"><b>解析 · </b>${q.explain}</div>
      </div>
    </details>`;
  }).join("");

  stageEl.innerHTML = `
  <div class="card res-hero">
    <div class="res-kicker">YOUR COGNITIVE PROFILE</div>
    <div class="score-big" id="scoreBig">0</div>
    <div class="score-cap">认 知 指 数 / 100</div>
    <div class="level-pill">${lvName}</div>
    <p class="pct-line">${lvDesc}</p>
    <div class="pct-line">综合估计：超过约 <b>${R.pct}%</b> 的参考人群<span style="color:var(--ink3)">（基于文献通过率拟合的估算常模）</span></div>
    <div class="res-grid2">
      <div class="mini"><div class="v">${R.correct} / ${R.scorable}</div><div class="k">题目正确数</div></div>
      <div class="mini"><div class="v">${R.medTime?(R.medTime/1000).toFixed(1)+"s":"—"}</div><div class="k">中位反应时</div><div class="sub">加工速度参考</div></div>
    </div>
    <div class="portrait"><b>你的画像：</b>最强维度是「${best.name}」（${best.v} 分），最薄弱的是「${worst.name}」（${worst.v} 分）。${best.v-worst.v>=25?"维度落差较大——你的能力发展不均衡，这既是短板提示，也意味着提升空间明确。":"各维度较为均衡，能力结构稳定。"}${best.v>=75?"你已经在最强维度上接近本次量表的顶部区间。":""}</div>
  </div>

  <div class="card">
    <div class="sec-title">六维能力图谱</div>
    <div class="radar-wrap">${radarSVG(dimsForRadar)}</div>
    <div class="dimrows" style="margin-top:24px">
      ${dimArr.map(d=>`<div class="dimrow">
        <div class="head"><b>${d.name}</b><span>${d.v} / 100</span></div>
        <div class="bar"><i data-w="${d.v}"></i></div>
        <div class="note">${DIM_NOTES[d.key]}</div>
      </div>`).join("")}
    </div>
  </div>

  <div class="card">
    <div class="sec-title">元认知 · 自我认知的准确度</div>
    <div class="cal-card">
      <div class="cal-num">${calibStr}</div>
      <div><b style="font-family:var(--serif)">元认知校准指数</b></div>
      <div style="font-size:13px;color:var(--ink2)">由每题的「把握程度 × 对错」计算（Brier 分数 ${R.brier==null?"—":R.brier.toFixed(3)}）：满分代表你的确信度与正确率高度一致——即「知道自己什么时候知道」。</div>
    </div>
    ${confMsg}
    <div class="sec-title" style="margin-top:34px">自评 vs 实测</div>
    ${dktHTML}${dktMsg}
    <div class="sec-title" style="margin-top:34px">作答质量</div>
    ${attMsg}${speedMsg}
  </div>

  <div class="card">
    <div class="sec-title">逐题回顾与解析</div>
    ${reviewHTML}
  </div>

  <div class="card">
    <div class="sec-title">认知低与认知高的六个分水岭</div>
    <p class="sec-intro" style="margin-bottom:6px">这不是天赋的分界，而是<b>习惯</b>的分界——以下每一条都可以通过刻意练习跨越。</p>
    <div class="waters">
      <div class="water"><div class="wname">直觉的驾驭</div><div class="vs"><div class="lo"><b>认知低</b>被第一反应驾驶，答案在问题读完前就出现</div><div class="hi"><b>认知高</b>把直觉当草稿，验证之后才采纳</div></div></div>
      <div class="water"><div class="wname">知识的边界</div><div class="vs"><div class="lo"><b>认知低</b>不知道自己不知道，因此格外确定</div><div class="hi"><b>认知高</b>清楚知道什么、不知道什么（元认知）</div></div></div>
      <div class="water"><div class="wname">概率的语言</div><div class="vs"><div class="lo"><b>认知低</b>被个案与故事打动，「我朋友就是这样的」</div><div class="hi"><b>认知高</b>先问基础率、样本量与独立性</div></div></div>
      <div class="water"><div class="wname">观点的更新</div><div class="vs"><div class="lo"><b>认知低</b>立场先行，只收集支持自己的证据</div><div class="hi"><b>认知高</b>贝叶斯式更新：新证据面前愿意修改自己</div></div></div>
      <div class="water"><div class="wname">因果的审慎</div><div class="vs"><div class="lo"><b>认知低</b>相关即因果，单一原因解释复杂事</div><div class="hi"><b>认知高</b>寻找第三变量、反向因果与替代解释</div></div></div>
      <div class="water"><div class="wname">与不确定共处</div><div class="vs"><div class="lo"><b>认知低</b>必须有确定答案，非黑即白</div><div class="hi"><b>认知高</b>与概率共存，按期望值而非按「一定」决策</div></div></div>
    </div>
    <div class="sec-title" style="margin-top:30px">给你的针对性建议</div>
    <div class="msg info"><b>优先补强「${worst.name}」：</b>${DIM_ADVICE[worst.key]}</div>
    <div class="msg info"><b>保持「${best.name}」：</b>${DIM_ADVICE[best.key]}</div>
  </div>

  <div class="card">

  /* 动画 */
  countUp($("#scoreBig"),R.idx,1500);
  requestAnimationFrame(()=>{
    document.querySelectorAll(".bar i").forEach(b=>{b.style.width=b.dataset.w+"%";});
    const pin=document.querySelector(".dkt .pin.real");
    if(pin){const target=pin.dataset.target;pin.style.left="0%";requestAnimationFrame(()=>requestAnimationFrame(()=>{pin.style.left=target+"%";}));}
  });
}
function countUp(el,target,dur){
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);if(p<1)requestAnimationFrame(f);})(t0);
}
function copyResult(){
  const R=computeScores(S);const[lvName]=levelOf(R.idx);
  const dims=[...SECTIONS.map(s=>`${s.name}${R.dims[s.key]}`),`工作记忆${R.dims.wm}`].join(" / ");
  const txt=`【认知罗盘 · 测试结果】认知指数 ${R.idx}/100（${lvName}），估算超过 ${R.pct}% 的参考人群。六维：${dims}。元认知校准 ${R.calib==null?"—":R.calib}。基于认知心理学经典范式的自测，仅供自我了解。`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("已复制到剪贴板"),()=>toast("复制失败"));
  }else{toast("该浏览器不支持复制");}
}

/* ---------------------- 自检 ---------------------- */
function selfTest(){
  const errs=[];
  QUESTIONS.forEach((q,i)=>{
    if(!q.fig&&(!q.opts||q.opts.length<3))errs.push(`Q${i+1} 选项不足`);
    if(!q.fig&&(q.a==null||q.a>=q.opts.length))errs.push(`Q${i+1} 答案越界`);
    if(q.fig&&(!q.figAngles||q.a>=q.figAngles.length))errs.push(`Q${i+1} 图形题配置错`);
    if(!q.att&&(!q.explain||q.explain.length<40))errs.push(`Q${i+1} 解析过短`);
    if(!q.att&&(!q.w||q.w<=0))errs.push(`Q${i+1} 权重异常`);
  });
  const nAtt=QUESTIONS.filter(q=>q.att).length;
  if(nAtt!==1)errs.push("注意力题数量异常: "+nAtt);
  const s=seedDemo();const R=computeScores(s);
  if(!(R.idx>=0&&R.idx<=100))errs.push("指数越界 "+R.idx);
  if(!(R.pct>0&&R.pct<=99.4))errs.push("百分位异常 "+R.pct);
  if(R.calib==null||R.calib<0||R.calib>100)errs.push("校准异常 "+R.calib);
  if(R.dims.wm!==67&&R.dims.wm!==Math.round(2.4/3.6*100))errs.push("WM计分异常 "+R.dims.wm);
  const full=newState();
  QUESTIONS.forEach((q,i)=>full.answers[i]={choice:q.a,conf:2,timeMs:9000});
  full.wm=[0,1,2].map(i=>({seq:"12345",input:"54321",ok:true}));
  full.selfRating=50;
  const RF=computeScores(full);
  if(RF.idx!==100)errs.push("满分测试≠100: "+RF.idx);
  if(RF.calib<99||RF.calib>100)errs.push("满分校准应≈100: "+RF.calib);
  const zero=newState();
  QUESTIONS.forEach((q,i)=>zero.answers[i]={choice:(q.a+1)%(q.fig?q.figAngles.length:q.opts.length),conf:2,timeMs:9000});
  zero.wm=[0,1,2].map(i=>({seq:"12345",input:"00000",ok:false}));
  if(computeScores(zero).idx!==0)errs.push("零分测试≠0: "+computeScores(zero).idx);
  return errs.length?("SELF-TEST FAIL:\n"+errs.join("\n")):("SELF-TEST PASS: "+QUESTIONS.length+" 题 / 权重和 "+
    QUESTIONS.reduce((a,q)=>a+(q.att?0:q.w),0).toFixed(1)+" / 全对="+RF.idx+"/100 全错=0/100 校准上下界=0..100 ✓");
}

/* ---------------------- 启动 ---------------------- */
if(PARAMS.get("__shot")){
  const sh=PARAMS.get("__shot");
  if(sh==="intro")S.stage="intro";
  else if(sh==="self")S.stage="self";
  else if(sh==="sec")S.stage="secintro";
  else if(sh==="q"){S.stage="q";S.qi=Math.min(8,S.qi);}
  else if(sh==="qpattern"){S.stage="q";S.qi=QUESTIONS.length-1;}
  else if(sh==="wm"){S.stage="wm";S.wi=0;S.wm=[];}
  else if(sh==="result"){S=seedDemo();}
}
render();
if(PARAMS.get("__diag")==="1"){
  const d=document.createElement("div");d.className="selftest";
  const app=document.getElementById("app");
  const ar=app.getBoundingClientRect();
  let over=[];
  document.querySelectorAll("#app *").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.width>0&&(r.right>ar.right+1||r.left<ar.left-1))over.push(el.tagName+"."+String(el.className).slice(0,34)+" L"+r.left.toFixed(0)+" R"+r.right.toFixed(0)+" (容器R"+ar.right.toFixed(0)+")");
  });
  d.textContent="DIAG appW="+ar.width.toFixed(0)+" overflow=\n"+(over.slice(0,12).join("\n")||"none");
  setTimeout(()=>app.appendChild(d),800);
}
if(PARAMS.get("__demo")==="1"||PARAMS.get("__selftest")==="1"){
  const d=document.createElement("div");d.className="selftest";d.textContent=selfTest();
  setTimeout(()=>document.getElementById("app").appendChild(d),600);
}
