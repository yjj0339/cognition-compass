<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>认知罗盘 · 测一测你的认知水平</title>
<meta name="description" content="基于认知心理学经典范式的认知水平评估：认知反思、逻辑推理、概率直觉、偏差识别、模式推理、工作记忆。约 12 分钟，测完给雷达图与逐题解析。">
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#181F30; --ink2:#5A6478; --ink3:#98A1B5;
  --brand:#4656D8; --brand-deep:#3843B8; --brand-soft:#EEF0FC; --brand-line:#D8DCF6;
  --amber:#F59E0B; --amber-soft:#FEF5E4;
  --good:#0FA678; --good-soft:#E7F7F0;
  --bad:#E4574B; --bad-soft:#FDEEec;
  --line:#E7EAF2;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"DIN Alternate","Bahnschrift","Segoe UI",var(--sans);
  --shadow:0 1px 2px rgba(24,31,48,.05),0 12px 32px rgba(24,31,48,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}
button{font-family:var(--sans)}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,246,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:12px}
.topbar .row{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink)}
.brand .hex{width:22px;height:22px;flex:none}
.crumb{font-size:12px;color:var(--ink3);text-align:right}
.crumb b{color:var(--brand);font-weight:600}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7B8AF0);border-radius:4px;transition:width .5s cubic-bezier(.25,.9,.3,1)}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:32px 28px;margin-top:24px;animation:rise .38s cubic-bezier(.25,.9,.3,1) both}
@media(max-width:560px){.card{padding:26px 20px;margin-top:16px;border-radius:18px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── 按钮 ── */
.btn{display:block;width:100%;border:none;cursor:pointer;background:var(--brand);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:.18em;text-indent:.18em;padding:15px;border-radius:14px;
  margin-top:24px;transition:.18s}
.btn:hover:not(:disabled){background:var(--brand-deep)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{font-size:14px;padding:12px;letter-spacing:.1em;text-indent:.1em}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);background:#fff}

/* ── 封面 ── */
.hero{text-align:center;padding-top:26px}
.logo{width:120px;height:120px;margin:0 auto 6px;display:block;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.h-kicker{font-size:11px;font-weight:700;letter-spacing:.44em;text-indent:.44em;color:var(--brand);margin:10px 0 6px}
h1{font-size:clamp(30px,7.6vw,42px);font-weight:800;letter-spacing:.06em}
.h-sub{color:var(--ink2);font-size:14.5px;margin-top:8px}
.pillrow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:22px 0 4px}
.pill{font-size:12px;color:var(--brand-deep);background:var(--brand-soft);border:1px solid var(--brand-line);
  border-radius:99px;padding:5px 12px;font-weight:600}
.h-stats{display:flex;justify-content:center;gap:34px;margin:22px 0 2px}
.h-stats .v{font-family:var(--num);font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.h-stats .k{font-size:11px;color:var(--ink3);margin-top:1px}
.h-note{background:var(--amber-soft);border:1px solid #F4E3BC;border-radius:14px;padding:13px 16px;
  font-size:13px;color:#8A6A1F;text-align:left;line-height:1.8;margin-top:20px}
.h-note b{color:#755714}
.linkline{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:16px}
.linkline a{color:var(--ink2);cursor:pointer;text-decoration:underline}

/* ── 自评 ── */
.stagehead{margin-bottom:4px}
.s-kick{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--brand)}
.s-title{font-size:26px;font-weight:800;margin:6px 0 10px;letter-spacing:.02em}
.s-body{color:var(--ink2);font-size:14.5px;text-align:justify}
.bigpct{font-family:var(--num);font-size:66px;font-weight:800;color:var(--brand);text-align:center;line-height:1.1;margin-top:26px;font-variant-numeric:tabular-nums}
.bigpct small{font-size:24px;color:var(--ink3);font-weight:600}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:6px;border-radius:3px;outline:none;margin:20px 0 4px;
  background:linear-gradient(90deg,var(--brand) var(--fill,72%),var(--line) var(--fill,72%))}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:3.5px solid var(--brand);box-shadow:0 2px 10px rgba(70,86,216,.3);cursor:pointer}
.marks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}

/* ── 节过渡 ── */
.sec-ico{width:56px;height:56px;border-radius:16px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:16px}
.sec-part{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--brand)}
.sec-name{font-size:27px;font-weight:800;margin:6px 0 10px}
.sec-desc{color:var(--ink2);font-size:14.5px;text-align:justify}
.sec-desc b{color:var(--ink)}
.sec-meta{margin-top:18px;font-size:12.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:13px}

/* ── 题目 ── */
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.q-no{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.q-tag{font-size:11px;color:var(--ink3);background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.q-text{font-size:17px;font-weight:600;line-height:1.85;margin-bottom:20px}
.q-text .hl{color:var(--brand-deep)}
.numline{font-family:var(--num);font-size:23px;letter-spacing:.14em;color:var(--brand-deep);background:var(--brand-soft);
  display:inline-block;padding:8px 18px;border-radius:12px;margin-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.numtab{display:inline-grid;grid-template-columns:auto auto auto auto;gap:7px 16px;margin-top:12px;font-family:var(--num);font-size:18px;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.numtab i{font-style:normal;color:var(--ink3);font-size:11.5px;align-self:center;font-family:var(--sans)}
.numtab span{background:var(--brand-soft);padding:3px 12px;border-radius:9px;text-align:center;min-width:50px;font-weight:700}
.numtab .qm{background:var(--amber-soft);color:#B07A0A}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#FBFCFE;
  border:1.8px solid var(--line);border-radius:13px;padding:13px 16px;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s;line-height:1.55}
.opt:hover{border-color:#C6CDE4}
.opt .abc{flex:none;width:25px;height:25px;border-radius:8px;border:1.5px solid #C9CFE2;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink3);transition:.15s}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .abc{background:var(--brand);border-color:var(--brand);color:#fff}
.opt .tick{margin-left:auto;color:var(--brand);font-weight:800;flex:none}
/* 图形题 */
.figgrid{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:8px;justify-content:center;
  margin:6px 0 20px;background:var(--bg);padding:14px;border-radius:16px;border:1px solid var(--line)}
.figgrid .cell{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center}
.figgrid .cell.qm{border-style:dashed;border-color:var(--amber);color:#B07A0A;font-size:24px;font-weight:800}
.figopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.figopts .opt{justify-content:center;padding:9px}

/* ── 置信度 ── */
.conf-zone{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.conf-label{font-size:13px;color:var(--ink2);margin-bottom:10px}
.conf-label b{color:var(--ink)}
.confs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf{border:1.5px solid var(--line);background:#FBFCFE;border-radius:11px;padding:9px 6px;cursor:pointer;text-align:center;transition:.15s}
.conf .c1{font-size:13.5px;font-weight:600;color:var(--ink)}
.conf .c2{font-size:11px;color:var(--ink3);margin-top:1px}
.conf:hover{border-color:#C6CDE4}
.conf.sel{border-color:var(--amber);background:var(--amber-soft)}
.conf.sel .c1{color:#9A6E08}.conf.sel .c2{color:#B07A0A}
.next-hint{font-size:12px;color:var(--ink3);text-align:center;margin-top:12px}

/* ── 工作记忆 ── */
.wm-stage{text-align:center;padding:14px 0 4px}
.wm-lv{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.wm-lv i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.wm-lv i.done{background:var(--good)}.wm-lv i.now{background:var(--amber)}
.wm-tip{color:var(--ink2);font-size:14px}
.wm-tip b{color:var(--bad)}
.wm-digits{font-family:var(--num);font-size:clamp(46px,11vw,62px);font-weight:800;letter-spacing:.3em;text-indent:.3em;
  color:var(--brand-deep);margin:28px 0 24px;min-height:1.25em;animation:pop .35s cubic-bezier(.2,1.5,.4,1) both;font-variant-numeric:tabular-nums}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.wm-timer{height:4px;background:var(--line);border-radius:3px;max-width:260px;margin:0 auto;overflow:hidden}
.wm-timer i{display:block;height:100%;background:var(--amber);width:100%;transform-origin:left}
.wm-input{font-family:var(--num);font-size:29px;text-align:center;letter-spacing:.28em;width:100%;
  border:2px solid var(--line);border-radius:13px;padding:13px;outline:none;margin-top:24px;color:var(--brand-deep);background:#FBFCFE}
.wm-input:focus{border-color:var(--brand)}
.wm-fb{margin-top:16px;font-size:14.5px;min-height:26px;font-weight:600}
.wm-fb.ok{color:var(--good)}.wm-fb.no{color:var(--bad)}

/* ── 结果 ── */
.res-hero{text-align:center;padding-top:12px}
.r-kick{font-size:11px;font-weight:700;letter-spacing:.4em;text-indent:.4em;color:var(--brand)}
.r-big{font-family:var(--num);font-size:clamp(76px,19vw,112px);font-weight:800;color:var(--ink);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.r-cap{color:var(--ink3);font-size:12px;letter-spacing:.3em;text-indent:.3em}
.level-pill{display:inline-block;margin-top:16px;padding:9px 26px;border-radius:99px;background:var(--brand);color:#fff;font-size:18px;font-weight:700;box-shadow:0 8px 22px rgba(70,86,216,.32)}
.pct-line{margin-top:16px;color:var(--ink2);font-size:14px}
.pct-line b{color:var(--ink);font-size:16px}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.mini .v{font-family:var(--num);font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.mini .k{font-size:11.5px;color:var(--ink3);margin-top:2px}
.portrait{margin-top:22px;padding:17px 20px;background:linear-gradient(135deg,#F6F7FD,#EEF3FB);border:1px solid var(--brand-line);border-radius:14px;font-size:14px;color:#3B4460;text-align:justify;line-height:1.85}
.portrait b{color:var(--brand-deep)}
.blk-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.blk-title::after{content:"";flex:1;height:1px;background:var(--line)}
.blk-title .n{font-family:var(--num);color:var(--brand);font-size:14px;font-weight:800}
.radar-wrap{display:flex;justify-content:center}
.dimrows{display:grid;gap:15px;margin-top:6px}
.dimrow .head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.dimrow .head b{font-weight:700}
.dimrow .head span{color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7B8AF0,var(--brand));width:0;transition:width 1s cubic-bezier(.25,.9,.3,1)}
.dimrow .note{font-size:12px;color:var(--ink3);margin-top:5px}
.cal-row{display:flex;gap:20px;align-items:center}
.cal-num{font-family:var(--num);font-size:46px;font-weight:800;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
.cal-num small{font-size:13px;color:var(--ink3);font-weight:600;display:block;margin-top:4px;font-family:var(--sans)}
.msg{border-radius:13px;padding:13px 17px;font-size:13.5px;line-height:1.8;margin-top:13px;text-align:justify}
.msg.good{background:var(--good-soft);color:#116B4F;border:1px solid #C7E9DA}
.msg.warn{background:var(--bad-soft);color:#96382F;border:1px solid #F2D4CF}
.msg.info{background:var(--brand-soft);color:#3A4699;border:1px solid var(--brand-line)}
.dkt{display:flex;align-items:center;gap:0;margin:20px 0 8px}
.dkt .pole{width:70px;text-align:center;font-size:11.5px;color:var(--ink3)}
.dkt .track{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--brand-soft),var(--line));position:relative}
.dkt .pin{position:absolute;top:50%;left:0;width:21px;height:21px;border-radius:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;transition:left 1.1s cubic-bezier(.25,.9,.3,1)}
.dkt .pin.self{background:var(--ink3);z-index:2}
.dkt .pin.real{background:var(--brand);box-shadow:0 2px 8px rgba(70,86,216,.4);z-index:3}
.legend{display:flex;gap:20px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
details.qa{border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:#FBFCFE;overflow:hidden}
details.qa summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 15px;font-size:14px;user-select:none}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary .mk{flex:none;width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800}
details.qa.ok summary .mk{background:var(--good)}
details.qa.no summary .mk{background:var(--bad)}
details.qa summary .t{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
details.qa summary .arr{color:var(--ink3);transition:.22s;flex:none}
details.qa[open] summary .arr{transform:rotate(90deg)}
details.qa .body{padding:2px 16px 16px 50px;border-top:1px dashed var(--line);font-size:13.3px;color:var(--ink2);line-height:1.85;text-align:justify}
details.qa .body .yours{margin:10px 0;padding:9px 13px;border-radius:9px;font-size:12.5px}
details.qa .body .yours.ok{background:var(--good-soft);color:#116B4F}
details.qa .body .yours.no{background:var(--bad-soft);color:#96382F}
details.qa .body .exp b{color:var(--ink)}
.waters{display:grid;gap:0}
.water{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:15px 2px;border-bottom:1px solid var(--line)}
.water:last-child{border-bottom:none}
@media(max-width:560px){.water{grid-template-columns:1fr;gap:7px}}
.water .wname{font-weight:800;font-size:14.5px;color:var(--brand-deep)}
.water .vs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.water .vs div{font-size:12.3px;line-height:1.7;padding:9px 12px;border-radius:10px}
.water .vs .lo{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.water .vs .hi{background:var(--brand-soft);color:#3A4699;border:1px solid var(--brand-line)}
.water .vs b{display:block;font-size:10.5px;letter-spacing:.14em;margin-bottom:2px;opacity:.65}
.disclaimer{font-size:12px;color:var(--ink3);line-height:1.85;text-align:justify;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
footer{margin-top:44px;text-align:center;color:var(--ink3);font-size:11.5px;line-height:2}
.selftest{font-family:Consolas,monospace;font-size:11px;color:#8b93a7;white-space:pre-wrap;padding:12px;margin-top:26px;background:#F0F1F6;border-radius:10px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="row">
      <span class="brand"><svg class="hex" viewBox="0 0 40 40"><polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="#4656D8" stroke-width="3"/><polygon points="20,13 26,23 14,23" fill="#F59E0B"/></svg>认知罗盘</span>
      <span class="crumb" id="crumb"></span>
    </div>
    <div class="progress"><i id="progBar" style="width:0%"></i></div>
  </div>
  <div id="stage"></div>
</div>

<script>
"use strict";
/* =====================================================================
   认知罗盘 v2 · 认知水平评估
   范式：CRT(Frederick 2005) / Wason(1966) / Kahneman-Tversky / Raven / 倒叙广度
   ===================================================================== */
const VERSION=2;
const CONF_VALS=[0.55,0.75,0.95];
const CONF_NAMES=[["纯靠直觉","55%"],["比较有把握","75%"],["非常确定","95%"]];

const SECTIONS=[
 {key:"reflect",name:"认知反思",icon:"◍",one:"能否按住第一反应，动笔验一验",
  desc:"这一节的每道题都有一个「听起来立刻就对」的答案——它通常是错的。心理学家弗雷德里克发现：答不答得对这类题，预测的不是聪不聪明，而是<b>愿不愿意动用聪明</b>。请刻意放慢半拍。",
  meta:"5 题 · 每题都埋了一个直觉陷阱"},
 {key:"logic",name:"逻辑推理",icon:"◈",one:"只按给定规则推导，不被画面感带走",
  desc:"只依据题目<b>给定</b>的规则作严格推导，不被常识和画面感带偏。三段论、条件推理和选择任务是「讲道理」的底层硬件——测你能否守住「必然成立」这条线。",
  meta:"4 题 · 抛开常识，只认规则"},
 {key:"prob",name:"概率直觉",icon:"◎",one:"用基础率和样本量思考不确定",
  desc:"人脑天生用「故事」代替「数学」。基础率忽视、赌徒谬误、合取谬误不是笨人的专利，而是全人类的默认设置——差别只在于有人装了纠错程序。这一节是普通人失分最集中的地方。",
  meta:"5 题 · 按数学作答，别按感觉"},
 {key:"bias",name:"偏差识别",icon:"◐",one:"在真实情境里当场认出思维陷阱",
  desc:"幸存者偏差、沉没成本、框架效应——知道名词不算数，能在<b>具体情境</b>里当场认出才算。题目都伪装成日常决策：看病、买票、看新闻。",
  meta:"4 题 + 1 题读题检查"},
 {key:"pattern",name:"模式推理",icon:"◇",one:"在数字与图形里发现抽象规则",

 {key:"wm",name:"工作记忆",icon:"▣",one:"脑中「草稿纸」的容量",

const QUESTIONS=[
 /* ── 一、认知反思 ── */
 {sec:0,w:1.2,a:2,trap:0,
  text:`文创店里，一本笔记本和一支笔一共 <span class="hl">21 元</span>，笔记本比笔贵 <span class="hl">19 元</span>。这支笔多少钱？`,
  opts:["2 元","10 元","1 元","1.5 元"],
  explain:`设笔为 x 元，笔记本为 x+19 元：x+(x+19)=21，解得 x=1。直觉会立刻报「2 元」，但 1+20=21 才成立；若笔 2 元，总价应是 24 元。这是认知反思测验（CRT）的经典结构：测的不是算术，而是你有没有<b>按住第一反应、动笔验一遍</b>。`},
 {sec:0,w:1.2,a:2,trap:1,
  text:`一条视频的播放量每天翻倍，第 <span class="hl">30 天</span>破 100 万。它在第几天达到 50 万？`,
  opts:["第 15 天","第 10 天","第 29 天","第 28 天"],
  explain:`每天翻倍意味着「往回一天就减半」：第 30 天 100 万，第 29 天恰好 50 万。直觉按比例折半得出 15，但指数增长的正确打开方式是逆向的。同样的结构藏在复利、传染人数、人口增长里——凡「每天翻倍」，先想减半倒推。`},
 {sec:0,w:1.1,a:0,trap:1,
  text:`5 位画师 5 天完成 <span class="hl">5 幅</span>定制画。照这个效率，100 位画师完成 100 幅需要几天？`,
  opts:["5 天","100 天","20 天","10 天"],
  explain:`每位画师 5 天画 1 幅，100 位同时开工，5 天正好交 100 幅。直觉会把「100」到处搬运，得出 100 天。关键是先<b>归一化</b>：算出单人单周期的产出，再放大——拒绝归一化、直接在表面数字之间连线，是直觉思维的典型动作。`},
 {sec:0,w:1.0,a:1,trap:0,
  text:`马拉松比赛进行中，你刚刚<b>超过了第二名</b>。你现在排第几？`,
  opts:["第一名","第二名","第三名","无法确定"],
  explain:`超过第二名后，你顶替的是他的位置——<b>第二名</b>，你前面还有第一名。直觉的画面感（「超过 → 我领先了」）抢在逻辑之前给出答案。画面越生动、答案越「显然」，越值得停半秒检查。`},
 {sec:0,w:1.1,a:2,trap:1,
  text:`工人把一根钢管锯成 <span class="hl">4 段</span>用了 <span class="hl">12 分钟</span>。按同样速度，锯成 8 段要用多久？`,
  opts:["24 分钟","32 分钟","28 分钟","16 分钟"],
  explain:`锯成 4 段只需锯 <b>3 刀</b>，每刀 4 分钟；锯成 8 段需要 7 刀，共 28 分钟。「8 是 4 的两倍所以 24 分钟」是直觉陷阱——段数与刀数永远相差 1。敲钟、爬楼、剪绳子都是这个结构：先数「动作次数」，再算时间。`},
 /* ── 二、逻辑推理 ── */
 {sec:1,w:1.1,a:1,trap:0,
  text:`便利店规定：<b>买啤酒的人必须年满 18 岁</b>。四个人同时进店，只能核验其中两位：<br>① 手里拿着啤酒　② 手里拿着可乐　③ 声称 16 岁　④ 声称 22 岁<br>核验哪两位，才能确保没有人违规？`,
  opts:["① 和 ④","① 和 ③","② 和 ③","③ 和 ④"],
  explain:`规则是「买啤酒 → 满 18」。拿啤酒的（①）必须查年龄；16 岁的（③）必须查有没有买酒——这两人是规则的必查点。拿可乐的没涉及酒，22 岁的买什么都不违规。这是沃森选择任务的生活版：同样的逻辑换成「喝酒查龄」，多数人立刻会做——<b>熟悉语境会大幅提升推理表现</b>，所以别太快原谅自己在陌生问题上的失误。`},
 {sec:1,w:1.2,a:1,trap:0,
  text:`前提一：所有的桂花树都是树。<br>前提二：有些树一到秋天就落叶。<br>结论：<span class="hl">有些桂花树一到秋天就落叶</span>。<br>只看这两个前提，这个结论——`,
  opts:["必然成立","不必然成立（前提全真时结论仍可能是假的）","必然为假","说不清前提是真是假"],
  explain:`「秋天落叶的树」可能全是别的树（梧桐、银杏），一棵桂花树都不在其中，两个前提依然为真——所以结论<b>不必然成立</b>。容易读成必然，是因为桂花的画面在脑中不断成像（「气氛效应」）。严格推理只认逻辑形式：结论的范围一旦超出前提，推论就失效。`},
 {sec:1,w:1.1,a:2,trap:0,
  text:`班里约定：「如果明天下雨，运动会就改到室内举行。」今天通知下来了：运动会改在室内。由此能严格推出——`,
  opts:["明天下雨了","明天没下雨","都推不出来","明天天气如何说不清，但大概率下了雨"],
  explain:`「下雨 → 改室内」不排除别的原因也改室内（场地冲突、空气质量）。看到结果就反推那个原因，叫<b>肯定后件谬误</b>——它是生活里大多数「我早就知道会这样」的来源。D 选项最像「合理的猜测」，但题目问的是<b>严格推出</b>：猜测再合理也不是推论。`},
 {sec:1,w:1.2,a:2,trap:0,
  text:`法律规定：「<b>只有</b>年满 18 周岁，才能报名考驾照。」小张下个月满 18。由此能严格推出——`,
  opts:["小张满 18 后就能报名","小张满 18 后也不能报名","两者都推不出来"],
  explain:`「只有…才…」是<b>必要条件</b>而非充分条件：18 岁是门槛，但可能还有视力、健康等其他条件。满足门槛 ≠ 自动满足全部条件。「只要满 18 就能考」才是充分条件——一字之差，逻辑结构完全不同。合同、法条、规章里到处是这类措辞。`},
 /* ── 三、概率直觉 ── */
 {sec:2,w:1.5,a:3,trap:0,
  text:`某疾病发病率 <span class="hl">千分之一</span>。检测很灵敏：患者检出阳性的概率 <span class="hl">90%</span>；但健康人也有 <span class="hl">9%</span> 被误报阳性。一个随机去体检的人查出<b>阳性</b>，他真患病的概率最接近——`,
  opts:["90%","约 50%","约 10%","约 1%"],
  explain:`想象 10000 人：患者约 10 人，其中 9 人呈阳性；健康人约 9990，其中 9%（约 899 人）被误报。阳性共约 908 人，真患者占 9/908 ≈ <b>1%</b>。事件越罕见，阳性里误报的比例越大——这叫<b>基础率忽视</b>。研究里医生群体也普遍高估。实用技巧：把概率换算成「每 10000 人里有几人」再判断。`},
 {sec:2,w:1.0,a:2,trap:0,
  text:`一对夫妇已经生了 <span class="hl">3 个女孩</span>。第 4 胎是男孩的概率是——`,
  opts:["大于 50%（该轮到男孩了）","小于 50%（这家的体质偏向女孩）","约 50%","无法估计"],
  explain:`每次受孕是独立事件，概率不随历史变化，仍约 50%。「该轮到男孩了」是<b>赌徒谬误</b>，「这家里女孩体质」是<b>热手谬误</b>——方向相反、结构相同：都把随机序列当成了有节奏的剧情。直觉觉得「连生三个女孩很反常」，其实它和任何组合一样平常。`},
 {sec:2,w:1.3,a:2,trap:0,
  text:`直播间有三个盲盒，只有一个藏着头奖。你先选了 1 号。<b>知道答案</b>的主播打开 3 号盒——空的，然后问：「要不要换 2 号？」换的话，中奖概率是——`,
  opts:["1/2","1/3","2/3","换不换一样"],
  explain:`你首选命中的概率是 1/3，落空 2/3。主播开门是「知情展示」，不改变比例，只是把那 2/3 集中到另一只没开的盒子上。枚举验证：奖在 1 号时换就输，在 2、3 号时换都赢——2/3。直觉答 1/2 忽略了「主播刻意避开了奖」这层信息不对称：他开门不是随机，而是带信息的动作。`},
 {sec:2,w:1.3,a:0,trap:1,
  text:`小林 28 岁，哲学系毕业，大学是辩论队主力，长期关注环保与动物保护，参加过多次公益行动。以下哪种情况<b>更可能</b>为真？`,
  opts:["小林在银行工作","小林在银行工作，且是活跃的环保志愿者","两种一样可能"],
  explain:`两个事件同时发生的概率不可能大于单个事件：「在银行工作 <b>且</b> 环保志愿者」是前者的子集，必然更少。但描述越具体、画面越连贯，大脑越觉得可信——这叫<b>合取谬误</b>。卡尼曼的实验里约 85% 的名校学生选了后者。<b>故事讲得通 ≠ 更可能发生</b>，这是阴谋论和精致骗局共同利用的漏洞。`},
 {sec:2,w:1.1,a:1,trap:2,
  text:`同一家产科，A 院区每天出生 <span class="hl">45 个</span>婴儿，B 院区每天约 <span class="hl">15 个</span>。统计一整年，哪个院区「当天男孩占比超过 60%」的<b>天数</b>更多？`,
  opts:["A 院区（大）","B 院区（小）","基本一样多"],
  explain:`样本越小，比例的随机波动越大。B 院区 15 个婴儿里 9 个男孩就超过 60%，这种波动常出现；A 院区要 27/45 以上才超标，难得一见。把小样本的波动当成真实规律，叫<b>小数定律</b>谬误——「我朋友吃了偏方就好了」「这软件连着三次出错」都是它的日常形态。看到任何结论先问：样本多大？`},
 /* ── 四、偏差识别 ── */
 {sec:3,w:1.2,a:1,trap:0,
  text:`二战时军方统计<b>返航</b>轰炸机的弹孔：机翼、机身弹孔密集，发动机部位几乎没弹孔。装甲有限，应优先加固哪里？`,
  opts:["弹孔最密集的机翼","几乎没有弹孔的发动机","全机均匀加固"],
  explain:`返航飞机展示的是「中弹还能飞回来」的位置；发动机中弹的飞机大多坠毁了，根本没回来接受统计。数据里<b>最少的弹孔，恰恰标记着最致命的位置</b>——统计学家沃德由此说服军方加固发动机。凡是「看得见的数据」都先问一句：没被看见的那部分，是怎么被筛掉的？成功学、用户反馈、中奖名单，无一例外。`},
 {sec:3,w:0.9,a:1,trap:0,
  text:`你花 680 元买了张演唱会门票（不可转退）。演出当天你重感冒、暴雨预警。怎样选择最理性？`,
  opts:["带病去，680 元不能白花","不去，在家休息","纠结到开场前再决定"],
  explain:`无论去不去，680 元都回不来了——它是<b>沉没成本</b>，理性决策只比较「接下来的时间和健康怎么安排更好」。「票都买了」「来都来了」「都谈三年了」是同一个谬误的日常形态：用更多投入去补偿已经损失的投入。能切割沉没成本的人不是无情，而是把账算在了<b>未来</b>。`},
 {sec:3,w:1.1,a:2,trap:0,
  text:`统计发现：一座城市里<span class="hl">奶茶店越多</span>的年份，<span class="hl">房价涨得越快</span>。最合理的解释是——`,
  opts:["奶茶店带动了商圈，推高房价","房价上涨让人有钱消费奶茶","城市经济与人口增长同时推高了两者"],
  explain:`两个变量一起变动，不代表谁导致谁——很可能是第三个因素（经济、人口、收入）在共同驱动，也可能纯属巧合。<b>相关不等于因果</b>人人会说，但落在具体数字上时，大脑的故事本能总是抢先给出因果剧本。看到「A 与 B 显著相关」的新闻，第一反应应该是找第三变量和反向因果。`},
 {sec:3,w:0.0,a:2,att:true,
  text:`这是一道<b>读题检查</b>，不计分数。请直接选择「蓝色」。`,
  opts:["红色","绿色","蓝色","黄色"],
  explain:`读题检查：认真读题就能答对，用于识别「扫一眼就选」的作答模式。`},
 {sec:3,w:1.0,a:0,trap:2,
  text:`同一场手术的同一个统计事实，两种说法：<br>说法 A：「术后一个月<b>存活率 90%</b>。」<br>说法 B：「术后一个月<b>死亡率 10%</b>。」<br>实验发现，患者听到哪种说法更倾向于同意手术？`,
  opts:["说法 A（存活率）","说法 B（死亡率）","两种说法效果完全相同"],
  explain:`90% 存活与 10% 死亡是<b>同一个事实</b>，但人们的选择会随表述方向显著改变——这叫<b>框架效应</b>（卡尼曼与特沃斯基发现）。它证明：人对「事实」的反应，很大程度取决于事实被包装的方式。高认知的人有个习惯：听到任何单一表述，主动翻译成相反框架（「成功率 90%」↔「失败率 10%」），核对一下自己的感受是否被措辞操纵了。`},
 /* ── 五、模式推理 ── */
 {sec:4,w:1.0,a:1,trap:0,
  text:`找出规律，推断下一个数：<div class="numline">2 &nbsp;5 &nbsp;11 &nbsp;23 &nbsp;47 &nbsp;?</div>`,
  opts:["71","95","94","93"],
  explain:`后一项 = 前一项 ×2 + 1：2→5→11→23→47→<b>95</b>。数列的通用策略：先看相邻差值（3、6、12、24、48，每次翻倍），差值本身就是一条新数列——<b>规律套规律</b>是这类题的钥匙。`},
 {sec:4,w:1.1,a:2,trap:0,
  text:`找出规律，推断下一个数：<div class="numline">1 &nbsp;4 &nbsp;10 &nbsp;22 &nbsp;46 &nbsp;?</div>`,
  opts:["58","92","94","70"],
  explain:`差值依次是 3、6、12、24、48（每次翻倍），46+48=<b>94</b>。能发现「规律可以有多条路径」本身就是高阶能力——验证答案同时满足多种结构时，置信度才配得上「非常确定」。`},
 {sec:4,w:1.2,a:2,trap:0,
  text:`观察每行三个数之间的规律：<div class="numtab"><i>第一行</i><span>4</span><span>9</span><span>19</span><i>第二行</i><span>5</span><span>11</span><span>23</span><i>第三行</i><span>6</span><span>13</span><span class="qm">?</span></div>`,
  opts:["25","26","27","29"],
  explain:`每行后一个数 = 前一个数 ×2 + 1：4→9→19；5→11→23；6→13→<b>27</b>。二维结构比一维数列多一层抽象：要假设「每行独立遵循同一规则」——这正是矩阵推理（瑞文测验）的基本思维单元。`},
 {sec:4,w:1.3,a:1,trap:0,fig:true,
  text:`九宫格中的图形按规律变化（行、列各有规律）。<span class="hl">?</span> 处应填哪个图形？`,
  opts:null,figAngles:[135,180,225,270],
  explain:`每个图形相对左上角：每向右或向下前进一格，就<b>逆时针旋转 45°</b>。第一行 0°、45°、90°；第二行 45°、90°、135°；第三行 90°、135°、<b>180°</b>。验证方式：沿任意行、任意列前进，旋转增量都恒为 45°，两条路径互相印证。图形旋转矩阵测的是脱离语言内容的抽象规则发现能力。`}
];

const WM_LEVELS=[5,6,7];
const WM_SECONDS=[3.4,4.0,4.6];

/* ───────── 状态 ───────── */
const LSK="cog-compass-v2";
function newState(){return{v:VERSION,stage:"intro",qi:0,wi:0,secIdx:0,
  answers:new Array(QUESTIONS.length).fill(null),
  wm:[],selfRating:null,startedAt:Date.now()};}
function save(){try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){}}
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(LSK));if(s&&s.v===VERSION&&s.stage)return s;}catch(e){}return null;}
let S=loadSaved()||newState();

const PARAMS=new URLSearchParams(location.search);
if(PARAMS.get("vw")){
  const st=document.createElement("style");
  st.textContent=`#app{max-width:${PARAMS.get("vw")}px !important}body{background:#E9EBF2}#app{background:#F5F6FA;min-height:100vh;margin:0 auto}`;
  document.head.appendChild(st);
}
if(PARAMS.get("__reset")==="1"){localStorage.removeItem(LSK);S=newState();}
if(PARAMS.get("__demo")==="1"){S=seedDemo();}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedDemo(){
  const s=newState(),rng=mulberry(7);
  QUESTIONS.forEach((q,i)=>{
    const good=rng()<.68;
    let choice=good?q.a:((q.trap!=null&&rng()<.7)?q.trap:Math.floor(rng()*(q.fig?q.figAngles.length:q.opts.length)));
    const conf=good?(rng()<.5?2:1):(rng()<.55?2:1);
    s.answers[i]={choice,conf,timeMs:6000+Math.floor(rng()*14000)};
  });
  s.wm=[{seq:"83175",input:"57138",ok:true},{seq:"492613",input:"316294",ok:true},{seq:"5738126",input:"9",ok:false}];
  s.selfRating=76;s.stage="result";return s;
}

/* ───────── 渲染调度 ───────── */
const $=s=>document.querySelector(s);
const stageEl=$("#stage");
const TOTAL=QUESTIONS.length+WM_LEVELS.length;
function stepNow(){
  switch(S.stage){
    case"q":return S.qi+1;
    case"wm":return QUESTIONS.length+S.wi+1;
    case"result":return TOTAL;
    default:return 0;
  }
}
function paintChrome(){
  const n=stepNow();
  $("#crumb").innerHTML=S.stage==="q"?`<b>${SECTIONS[QUESTIONS[S.qi].sec].name}</b> · ${n}/${TOTAL}`
    :S.stage==="wm"?`<b>工作记忆</b> · ${QUESTIONS.length+S.wi+1}/${TOTAL}`
    :S.stage==="result"?`<b>完成</b>`:"";
  $("#progBar").style.width=(n/TOTAL*100)+"%";
}
function render(){
  paintChrome();

/* ───────── 计分 ───────── */
const DIM_W={reflect:.20,logic:.18,prob:.20,bias:.15,pattern:.12,wm:.15};
function computeScores(st){
  const got={},max={};
  SECTIONS.forEach(s=>{got[s.key]=0;max[s.key]=0;});
  let correct=0,scorable=0;
  QUESTIONS.forEach((q,i)=>{
    if(q.att)return;scorable++;
    max[SECTIONS[q.sec].key]+=q.w;
    const a=st.answers[i];
    if(a&&a.choice===q.a){got[SECTIONS[q.sec].key]+=q.w;correct++;}
  });
  let wg=0,wm2=0;st.wm.forEach(t=>{wm2+=1.2;if(t.ok)wg+=1.2;});
  const dims={};
  SECTIONS.forEach(s=>dims[s.key]=max[s.key]>0?Math.round(got[s.key]/max[s.key]*100):0);
  dims.wm=wm2>0?Math.round(wg/wm2*100):0;
  let idx=0;for(const k in DIM_W)idx+=DIM_W[k]*dims[k];
  idx=Math.round(idx);
  const pct=Math.min(99.4,Math.round(100/(1+Math.exp(-(idx-47)/10.5))*10)/10);
  let bs=0,bn=0,hiT=0,hiW=0;
  QUESTIONS.forEach((q,i)=>{
    const a=st.answers[i];if(!a||q.att)return;
    const c=CONF_VALS[a.conf],cor=a.choice===q.a?1:0;
    bs+=(c-cor)**2;bn++;
    if(a.conf===2){hiT++;if(!cor)hiW++;}
  });
  const brier=bn?bs/bn:null;
  const calib=brier==null?null:Math.max(0,Math.round((0.25-brier)/0.25*100));
  const overconf=hiT?hiW/hiT:0;
  const times=QUESTIONS.map((q,i)=>q.att?null:st.answers[i]).filter(a=>a).map(a=>a.timeMs).sort((x,y)=>x-y);
  const medTime=times.length?times[Math.floor(times.length/2)]:null;
  const fastN=times.filter(t=>t<3500).length;
  const ai=QUESTIONS.findIndex(q=>q.att);
  const attOk=ai>=0&&st.answers[ai]?st.answers[ai].choice===QUESTIONS[ai].a:null;
  return{dims,idx,pct,correct,scorable,brier,calib,overconf,hiT,hiW,medTime,fastN,attOk,selfPct:st.selfRating};
}
function levelOf(x){
  if(x>=78)return["L5 · 元认知驱动型","你不仅思考，还持续监控思考本身；直觉是你的员工，不是你的老板。"];
  if(x>=62)return["L4 · 系统分析型","概率与逻辑已内化成习惯动作，多数问题现场能主动调用它们。"];
  if(x>=48)return["L3 · 审慎思考型","你能按住直觉、放慢验证，大多数陷阱拦不住你，偶有失守。"];
  if(x>=33)return["L2 · 经验推理型","常识推理可靠，但在「听起来立刻就对」的陷阱前防线较薄。"];
  return["L1 · 直觉驱动型","决策主要依赖第一反应。好消息：反思能力完全可训练，下方解析就是起点。"];
}

function radarSVG(dims){
  const labels=[...SECTIONS.map(s=>s.name),"工作记忆"];
  const vals=[...SECTIONS.map(s=>dims[s.key]),dims.wm];
  const cx=175,cy=160,R=116,N=6;
  const pt=(i,r)=>{const a=(-90+i*360/N)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g="";
  for(const f of[.2,.4,.6,.8,1])g+=`<polygon points="${vals.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#E5E8F1" stroke-width="1"/>`;
  let ax="",lb="";
  labels.forEach((l,i)=>{
    const[x,y]=pt(i,R);ax+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E5E8F1"/>`;
    const[lx,ly]=pt(i,R+28);
    lb+=`<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="middle" font-size="14.5" font-weight="700" fill="#181F30">${l}</text>`;
    const vx=vals[i];if(vx!=null)lb+=`<text x="${((lx-cx)*.8+cx).toFixed(1)}" y="${((ly-cy)*.8+cy-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#B07A0A">${vx}</text>`;
  });
  const live=vals.map(v=>Math.max(v,2));
  const poly=live.map((v,i)=>pt(i,R*v/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 350 335" style="width:min(100%,352px);display:block">
    ${g}${ax}
    <polygon points="${poly}" fill="rgba(70,86,216,.15)" stroke="#4656D8" stroke-width="2.2" stroke-linejoin="round"/>
    ${live.map((v,i)=>{const[x,y]=pt(i,R*v/100);return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#4656D8"/>`;}).join("")}
    ${lb}</svg>`;
}

  const rd={};dimArr.forEach(d=>rd[d.key]=d.v);

  if(R.selfPct!=null){

      <div class="pole">实测<br>${R.pct}%</div></div>
      <div class="legend"><span><i style="background:var(--ink3)"></i>开始前的自评</span><span><i style="background:var(--brand)"></i>实测百分位（估算）</span></div>`;
    if(diff>25)dktMsg=`<div class="msg warn"><b>自评明显高于实测（+${Math.round(diff)} 个百分点）。</b>这正是达克效应的经典模式：在严谨推理任务上，训练不足的人往往意识不到自己漏掉了什么——因为「发现漏洞」所需要的能力，正是「意识到有漏洞」所需要的能力。这不是批评，这一现象人人都有，只是幅度不同。</div>`;
    else if(diff<-20)dktMsg=`<div class="msg info"><b>自评低于实测（${Math.round(diff)} 个百分点）。</b>你倾向低估自己——这在推理能力强的人群中反而常见：他们清楚知识的边界，却把「知道还有多少不知道」误算成了自己的短板。</div>`;
    else dktMsg=`<div class="msg good"><b>自评与实测只差 ${Math.abs(Math.round(diff))} 个百分点——自我认知相当准确。</b>准确的自我评估是元认知健康的核心标志：你了解自己的水平，也不被它绑架。</div>`;
  }
  let confMsg="";
  if(R.overconf>=.4&&R.hiT>=3)confMsg=`<div class="msg warn">你在 ${R.hiT} 道「非常确定」的题里错了 ${R.hiW} 道——高置信错误率 <b>${Math.round(R.overconf*100)}%</b>。直觉没有你以为的那么可靠，校准方向：把一部分「非常确定」降级，并给重要决策加装验证步骤。</div>`;
  else if(R.calib!=null&&R.calib>=60)confMsg=`<div class="msg good">置信度与正确率匹配良好（校准指数 ${R.calib}）：你不仅答得对，还知道自己什么时候对——这是高水平决策者的标志性特征。</div>`;
  else confMsg=`<div class="msg info">校准指数 ${R.calib==null?"—":R.calib}：把握程度与实际正确率之间还有调整空间。校准目标：95% 置信时每 20 题最多错 1 题。</div>`;
  let speedMsg="";
  if(R.medTime!=null){
    const sec=(R.medTime/1000).toFixed(1);
    speedMsg=R.fastN>=R.scorable*.4
      ?`<div class="msg warn">中位作答 ${sec} 秒，且 ${R.fastN}/${R.scorable} 题不足 3.5 秒——作答偏快。对直觉陷阱类题目，速度是最强的敌人；放慢本身就能显著提高正确率。</div>`
      :`<div class="msg info">中位作答时间 ${sec} 秒（加工速度参考）。</div>`;
  }
  const attMsg=R.attOk===false
    ?`<div class="msg warn">读题检查<b>未通过</b>——本次可能存在扫一眼就选的情况，结果或低估了你的真实水平，建议安静时重测一次。</div>`
    :`<div class="msg good">读题检查通过，作答认真度良好。</div>`;

  const review=QUESTIONS.map((q,i)=>{
    const a=S.answers[i];
    const ok=a&&a.choice===q.a;
    const brief=(q.fig?"图形旋转矩阵（九宫格）":q.text.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,32))+"…";
    const ytxt=a?(q.fig?q.figAngles[a.choice]+"° 图形":q.opts[a.choice]):"未作答";
    const rtxt=q.fig?q.figAngles[q.a]+"° 图形":q.opts[q.a];
    return `<details class="qa ${ok?"ok":"no"}">
      <summary><span class="mk">${ok?"✓":"✗"}</span><span class="t">${i+1}. ${brief}</span><span class="arr">›</span></summary>
      <div class="body"><div>${q.text}</div>
        <div class="yours ${ok?"ok":"no"}">你的答案：${ytxt}${q.att?"（读题检查，不计分）":"　·　把握："+CONF_NAMES[a?a.conf:1][0]+"　·　用时："+(a?(a.timeMs/1000).toFixed(1)+"s":"—")}</div>
        ${ok?"":`<div class="yours no">正确答案：${rtxt}</div>`}
        <div class="exp"><b>解析 · </b>${q.explain}</div></div></details>`;
  }).join("");

  stageEl.innerHTML=`
  <div class="card res-hero">
    <div class="r-kick">YOUR COGNITIVE PROFILE</div>
    <div class="r-big" id="rBig">0</div>
    <div class="r-cap">认 知 指 数 / 100</div>
    <div class="level-pill">${lv}</div>
    <p class="pct-line">${dv}</p>
    <div class="pct-line">综合估计：超过约 <b>${R.pct}%</b> 的参考人群<span style="color:var(--ink3)">（按文献通过率拟合的估算常模）</span></div>
    <div class="r-grid">
      <div class="mini"><div class="v">${R.correct}/${R.scorable}</div><div class="k">题目正确数</div></div>
      <div class="mini"><div class="v">${R.medTime?(R.medTime/1000).toFixed(1)+"s":"—"}</div><div class="k">中位反应时</div></div>
    </div>
    <div class="portrait"><b>你的画像：</b>最强维度「${best.name}」（${best.v} 分），最薄弱「${worst.name}」（${worst.v} 分）。${best.v-worst.v>=25?"维度落差较大——能力发展不均衡，短板明确，提升空间也明确。":"各维度较均衡，能力结构稳定。"}${best.v>=75?"你在最强维度已接近本量表顶部区间。":""}</div>
  </div>

  <div class="card">
    <div class="blk-title"><span class="n">01</span>六维能力图谱</div>
    <div class="radar-wrap">${radarSVG(rd)}</div>
    <div class="dimrows" style="margin-top:22px">
      ${dimArr.map(d=>`<div class="dimrow">
        <div class="head"><b>${d.name}</b><span>${d.v} / 100</span></div>
        <div class="bar"><i data-w="${d.v}"></i></div>
        <div class="note">${DIM_NOTES[d.key]}</div></div>`).join("")}
    </div>
  </div>

  <div class="card">
    <div class="blk-title"><span class="n">02</span>元认知 · 自我认知的准确度</div>
    <div class="cal-row">
      <div class="cal-num">${R.calib==null?"—":R.calib}<small>校准指数</small></div>
      <div style="font-size:13px;color:var(--ink2)">由每题「把握程度 × 对错」计算（Brier 分数 ${R.brier==null?"—":R.brier.toFixed(3)}）。指数越高，你的确信度与正确率越一致——即「知道自己什么时候知道」。</div>
    </div>
    ${confMsg}
    <div class="blk-title" style="margin-top:30px"><span class="n">03</span>自评 vs 实测</div>
    ${dkt}${dktMsg}
    <div class="blk-title" style="margin-top:30px"><span class="n">04</span>作答质量</div>
    ${attMsg}${speedMsg}
  </div>

  <div class="card">
    <div class="blk-title"><span class="n">05</span>逐题回顾与解析</div>
    ${review}
  </div>

  <div class="card">
    <div class="blk-title"><span class="n">06</span>认知低与认知高的六个分水岭</div>
    <p class="s-body" style="margin-bottom:4px">这不是天赋的分界，而是<b>习惯</b>的分界——每一条都可以靠刻意练习跨越。</p>
    <div class="waters">
      <div class="water"><div class="wname">直觉的驾驭</div><div class="vs"><div class="lo"><b>认知低</b>被第一反应驾驶，答案在问题读完前就出现</div><div class="hi"><b>认知高</b>把直觉当草稿，验证之后才采纳</div></div></div>
      <div class="water"><div class="wname">知识的边界</div><div class="vs"><div class="lo"><b>认知低</b>不知道自己不知道，因此格外确定</div><div class="hi"><b>认知高</b>清楚知道什么、不知道什么</div></div></div>
      <div class="water"><div class="wname">概率的语言</div><div class="vs"><div class="lo"><b>认知低</b>被个案与故事打动：「我朋友就是这样」</div><div class="hi"><b>认知高</b>先问基础率、样本量与独立性</div></div></div>
      <div class="water"><div class="wname">观点的更新</div><div class="vs"><div class="lo"><b>认知低</b>立场先行，只收集支持自己的证据</div><div class="hi"><b>认知高</b>新证据面前愿意修改自己</div></div></div>
      <div class="water"><div class="wname">因果的审慎</div><div class="vs"><div class="lo"><b>认知低</b>相关即因果，单一原因解释复杂事</div><div class="hi"><b>认知高</b>寻找第三变量、反向因果与替代解释</div></div></div>
      <div class="water"><div class="wname">与不确定共处</div><div class="vs"><div class="lo"><b>认知低</b>必须有确定答案，非黑即白</div><div class="hi"><b>认知高</b>按概率与期望值决策</div></div></div>
    </div>
    <div class="blk-title" style="margin-top:26px"><span class="n">07</span>给你的两条建议</div>
    <div class="msg info"><b>优先补强「${worst.name}」：</b>${DIM_ADVICE[worst.key]}</div>
    <div class="msg info"><b>保持「${best.name}」：</b>${DIM_ADVICE[best.key]}</div>
  </div>

  <div class="card">
    <div class="blk-title"><span class="n">08</span>关于本测试</div>
    <div class="disclaimer">本测试基于认知心理学经典范式编制：认知反思测验（Frederick, 2005）、选择任务（Wason, 1966）、卡尼曼与特沃斯基的概率判断实验（合取谬误、基础率忽视、小数定律）、瑞文式矩阵推理与数字倒叙广度。百分位由文献报告的各题通过率拟合的估算常模映射，仅供参考；本测试不是标准化智力测验，不构成任何临床、招聘用途的评估。认知能力多维且可塑，任何单一数字都定义不了你。</div>
    <button class="btn" id="btnCopy">复制结果摘要</button>
    <button class="btn ghost" id="btnAgain" style="margin-top:12px">重新测试（工作记忆题会更换）</button>
  </div>
  <footer>认知罗盘 Cognitive Compass · 愿你把直觉当员工，而不是当老板</footer>`;

  countUp($("#rBig"),R.idx,1400);
  requestAnimationFrame(()=>{
    document.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%");
    const pin=$("#pinReal");if(pin)requestAnimationFrame(()=>requestAnimationFrame(()=>{pin.style.left=Math.max(2,Math.min(98,R.pct))+"%";}));
  });
  $("#btnCopy").onclick=()=>{
    const dims=dimArr.map(d=>`${d.name}${d.v}`).join(" / ");
    const txt=`【认知罗盘 · 测试结果】认知指数 ${R.idx}/100（${lv}），估算超过 ${R.pct}% 的参考人群。六维：${dims}。元认知校准 ${R.calib==null?"—":R.calib}。基于认知心理学经典范式的自测，仅供自我了解。`;
    (navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(txt).then(()=>toast("已复制到剪贴板"),()=>toast("复制失败")):toast("该浏览器不支持复制");
  };
  $("#btnAgain").onclick=()=>{S=newState();save();render();};
}
function countUp(el,t,d){
  const t0=performance.now();
  (function f(x){const p=Math.min(1,(x-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(t*e);if(p<1)requestAnimationFrame(f);})(t0);
}
function toast(m){
  const t=document.createElement("div");t.textContent=m;
  t.style.cssText="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#181F30;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;z-index:99";
  document.body.appendChild(t);setTimeout(()=>t.remove(),1800);
}

/* ───────── 自检 ───────── */
function selfTest(){
  const errs=[];
  QUESTIONS.forEach((q,i)=>{
    if(!q.fig&&(!q.opts||q.opts.length<3))errs.push(`Q${i+1}选项不足`);
    if(!q.fig&&(q.a==null||q.a>=q.opts.length))errs.push(`Q${i+1}答案越界`);
    if(q.fig&&(!q.figAngles||q.a>=q.figAngles.length))errs.push(`Q${i+1}图形配置错`);
    if(!q.att&&(!q.explain||q.explain.length<40))errs.push(`Q${i+1}解析过短`);
    if(!q.att&&(!q.w||q.w<=0))errs.push(`Q${i+1}权重异常`);
    if(!q.att&&q.trap!=null&&!q.fig&&q.trap===q.a)errs.push(`Q${i+1}陷阱=答案`);
  });
  if(QUESTIONS.filter(q=>q.att).length!==1)errs.push("读题检查题数量异常");
  const full=newState();
  QUESTIONS.forEach((q,i)=>full.answers[i]={choice:q.a,conf:2,timeMs:9000});
  full.wm=[0,1,2].map(()=>({seq:"12345",input:"54321",ok:true}));full.selfRating=50;
  const RF=computeScores(full);
  if(RF.idx!==100)errs.push("全对≠100:"+RF.idx);
  if(RF.calib<99)errs.push("满分校准应≈100:"+RF.calib);
  const zero=newState();
  QUESTIONS.forEach((q,i)=>zero.answers[i]={choice:(q.a+1)%(q.fig?q.figAngles.length:q.opts.length),conf:2,timeMs:9000});
  zero.wm=[0,1,2].map(()=>({seq:"12345",input:"00000",ok:false}));
  if(computeScores(zero).idx!==0)errs.push("全错≠0:"+computeScores(zero).idx);
  return errs.length?("SELF-TEST FAIL:\n"+errs.join("\n")):`SELF-TEST PASS: ${QUESTIONS.length}题/权重和${QUESTIONS.reduce((a,q)=>a+(q.att?0:q.w),0).toFixed(1)}/全对=100 全错=0 校准0-99 ✓`;
}

/* ───────── 自动全流程（调试）：?__auto=1 ───────── */
function autoRun(){
  const errs=[];window.__autoErrors=errs;window.__autoLog=[];
  window.onerror=(m,s,l)=>{errs.push(m+"@"+l);};
  const log=m=>{window.__autoLog.push(m);};
  (function step(){
    try{
      const st=S.stage;log(st+(st==="q"?("#"+(S.qi+1)):st==="wm"?("#"+(S.wi+1)):""));
      if(st==="intro"){$("#btnGo").click();}
      else if(st==="self"){S.selfRating=72;$("#btnSelf").click();}
      else if(st==="secintro"){$("#btnSec").click();}
      else if(st==="q"){
        const q=QUESTIONS[S.qi];
        const right=S.qi%4!==2;
        const pick=right?q.a:(q.a+1)%(q.fig?q.figAngles.length:q.opts.length);
        pickOpt(pick);
        if(!q.att)pickConf(right?2:1);
        const btn=$("#nextBtn");
        if(btn.disabled)throw new Error("nextBtn 在完整作答后仍禁用 @Q"+(S.qi+1));
        nextQ();
      }
      else if(st==="wm"){
        const inp=$("#wmIn");
        if(inp&&!inp.disabled){
          const t=S.wm[S.wi];
          inp.value=S.wi<2?t.seq.split("").reverse().join(""):"0";
          wmCheck();
        }
        setTimeout(step,350);return;
      }
      else if(st==="result"){
        const d=document.createElement("div");d.className="selftest";d.id="autoResult";
        d.textContent="AUTO "+(errs.length?"FAIL: "+errs.join(" | "):`PASS 全流程 ${TOTAL} 步无错误 idx=${computeScores(S).idx} correct=${computeScores(S).correct}/${computeScores(S).scorable}`)+"\nTRACE "+window.__autoLog.slice(-40).join(">");
        document.getElementById("app").appendChild(d);return;
      }
      setTimeout(step,120);
    }catch(e){errs.push(String(e));
      const d=document.createElement("div");d.className="selftest";d.id="autoResult";
      d.textContent="AUTO FAIL: "+errs.join(" | ");document.getElementById("app").appendChild(d);}
  })();
}

/* ───────── 启动 ───────── */
if(PARAMS.get("__shot")){
  const sh=PARAMS.get("__shot");
  if(sh==="intro")S.stage="intro";
  else if(sh==="self")S.stage="self";
  else if(sh==="sec")S.stage="secintro";
  else if(sh==="q"){S.stage="q";S.qi=Math.min(6,Math.max(0,S.qi));}
  else if(sh==="qpattern"){S.stage="q";S.qi=QUESTIONS.length-1;}
  else if(sh==="wm"){S.stage="wm";S.wi=0;S.wm=[];}
  else if(sh==="result")S=seedDemo();
}
render();
if(PARAMS.get("__demo")==="1"||PARAMS.get("__selftest")==="1"){
  const d=document.createElement("div");d.className="selftest";
  d.textContent=selfTest();
  setTimeout(()=>document.getElementById("app").appendChild(d),600);
}
if(PARAMS.get("__diag")==="1"){
  const d=document.createElement("div");d.className="selftest";
  setTimeout(()=>{
    const app=document.getElementById("app"),ar=app.getBoundingClientRect();
    const over=[];
    document.querySelectorAll("#app *").forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.width>0&&(r.right>ar.right+1||r.left<ar.left-1))over.push(el.tagName+"."+String(el.className).slice(0,30)+" R"+r.right.toFixed(0)+"(容器R"+ar.right.toFixed(0)+")");
    });
    d.textContent="DIAG appW="+ar.width.toFixed(0)+" overflow=\n"+(over.slice(0,10).join("\n")||"none");
    app.appendChild(d);
  },800);
}
if(PARAMS.get("__auto")==="1"){autoRun();
  setTimeout(()=>{
    if(!document.getElementById("autoResult")){
      const d=document.createElement("div");d.className="selftest";d.id="autoResult";
      d.textContent="AUTO STUCK at stage="+S.stage+(S.stage==="q"?" q"+(S.qi+1):"")+(S.stage==="wm"?" wm"+(S.wi+1):"")+"\nTRACE "+(window.__autoLog||[]).slice(-40).join(">");
      document.getElementById("app").appendChild(d);
    }
  },25000);
}
</script>
</body>
</html>
